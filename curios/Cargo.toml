[package]
name = "curios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios native compiler: the CLI, Binaryen optimization, Wasmtime precompilation, executable bundling, browser pages, and the documentation pages"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-pipeline/profile",
    "curios-verdict/profile",
    "curios-native/profile",
]

[dependencies]
curios-profile = { workspace = true }
curios-wasm = { workspace = true }
# For the `ffi` rows a compilation harvests and a link is typed by: this crate carries them from the pipeline to the runtime, and names no other part of the wire contract.
curios-abi = { workspace = true }
curios-module = { workspace = true }
curios-surface = { workspace = true }
curios-common = { workspace = true }
curios-pipeline = { workspace = true }
curios-package = { workspace = true }
curios-verdict = { workspace = true }
curios-wonder = { workspace = true }
curios-document = { workspace = true }
curios-archive = { workspace = true }
curios-binaryen = { workspace = true }
curios-native = { workspace = true }
# The browser's host: what a page holds and how it is laid out.
curios-browser = { workspace = true }
# Cranelift behind the runtime's engine: what compiles a module, which the launcher never links. Wasmtime itself is named nowhere in this crate.
curios-cranelift = { workspace = true }
clap = { workspace = true }
# The token a test serve admits reports under, on the workspace's one row for the OS's randomness.
getrandom = { workspace = true }

# The cross-stage suites in `src/tests` reach into individual pipeline stages; the product code never does.
[dev-dependencies]
# The runtime's test support too, for the replies no checked host gives that the guest's own checks of a reply are tested against.
curios-native = { workspace = true, features = ["test-support"] }
# The puts, which judge a program or a module with the prelude in scope as the board does. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-pipeline = { workspace = true, features = ["test-support"] }
# The law table the generated grid states and holds at closed values.
curios-algebra = { workspace = true }
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-cps = { workspace = true }
curios-elab = { workspace = true }
curios-emit = { workspace = true }
# Its test support too: a module's digest, the census's verdict and the weight of a description's copy, which the codegen and format suites pin.
curios-anf = { workspace = true, features = ["test-support"] }
curios-num = { workspace = true }
# Where the standard library is authored, for the transport test that asks about one of its files.
curios-prelude = { workspace = true, features = ["test-support"] }
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
