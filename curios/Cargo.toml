[package]
name = "curios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios native compiler: the CLI, Binaryen optimization, Wasmtime precompilation, executable bundling, browser pages, and the documentation pages"

[lints]
workspace = true

[features]
# `test_support`: what this crate's suites, `curios-prelude`'s and the bench's measurements share — a module compiled and run in this process, the programs a suite compiles and runs, and the structural fixtures. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness. **Never add this to `default`.**
test-support = [
    "dep:curios-anf",
    "curios-anf/test-support",
    "dep:curios-cps",
    "curios-native/test-support",
    "curios-common/test-support",
    "curios-pipeline/test-support",
]

[dependencies]
# The modules an ANF and a CPS stage hand back, for the test support's compiles to them alone.
curios-anf = { workspace = true, optional = true }
curios-cps = { workspace = true, optional = true }
curios-profile = { workspace = true }
# The look count a recorder this crate opens is handed (`TALLIES`), which `curios-profile` names nothing of: the one item of `curios-core` the product reads.
curios-core = { workspace = true }
curios-wasm = { workspace = true }
# For the `ffi` rows a compilation harvests and a link is typed by: this crate carries them from the pipeline to the runtime, and names no other part of the wire contract.
curios-abi = { workspace = true }
curios-module = { workspace = true }
curios-surface = { workspace = true }
curios-common = { workspace = true }
curios-pipeline = { workspace = true }
# The budget `--budget` defaults to: the elaborator's.
curios-elab = { workspace = true }
curios-package = { workspace = true }
curios-verdict = { workspace = true }
curios-wonder = { workspace = true }
curios-document = { workspace = true }
curios-archive = { workspace = true }
curios-binaryen = { workspace = true }
curios-native = { workspace = true }
# The browser's host: what a page holds and how it is laid out.
curios-browser = { workspace = true }
# Cranelift behind the runtime's engine: what compiles a module, which the launcher never links. Wasmtime itself is named nowhere in this crate.
curios-cranelift = { workspace = true }
clap = { workspace = true }
# The socket a test serve's runner drives the run over: its handshake and its frames, which the serve alone names.
tungstenite = { version = "0.30.0" }
# The heads of the requests a serve reads, with the parser the socket's handshake is already read with.
httparse = { version = "1.10.1" }

# The cross-stage suites in `src/tests` reach into individual pipeline stages; the product code never does.
[dev-dependencies]
# The runtime's test support too, for the replies no checked host gives that the guest's own checks of a reply are tested against.
curios-native = { workspace = true, features = ["test-support"] }
# The puts, which judge a program or a module with the prelude in scope as the board does. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-pipeline = { workspace = true, features = ["test-support"] }
# The directory a cabinet files each family in, which the suites that read what a command filed list and block.
curios-package = { workspace = true, features = ["test-support"] }
# Its test support too: a library's documentation record made the way a question compiles, and the names a subject and its records are read by. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-wonder = { workspace = true, features = ["test-support"] }
# The law table the generated grid states and holds at closed values.
curios-algebra = { workspace = true }
# Where a totality refusal stands, erased as a proof or as a type, which the rules' suites hold a refusal to.
curios-analysis = { workspace = true }
# Its test support too: a certifier error by name, which the rules' suites print a refusal by.
curios-cert = { workspace = true, features = ["test-support"] }
curios-core = { workspace = true }
curios-cps = { workspace = true }
# Its test support too: an error read beneath where it was raised, and by name, which the rules' suites hold a refusal to.
curios-elab = { workspace = true, features = ["test-support"] }
curios-emit = { workspace = true }
# Its test support too: a module's digest, the census's verdict and the weight of a description's copy, which the codegen and format suites pin.
curios-anf = { workspace = true, features = ["test-support"] }
curios-num = { workspace = true }
# The prelude's units, for the suites that read them whole.
curios-prelude = { workspace = true }
# Where the standard library is authored, for the transport test that asks about one of its files.
curios-prelude-build = { workspace = true }
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
