[package]
name = "curios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios native compiler: CLI, Binaryen optimization, Wasmtime precompilation, and executable bundling"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-pipeline/profile",
    "curios-runtime/profile",
]

[dependencies]
curios-profile = { workspace = true }
curios-wasm = { workspace = true }
curios-text = { workspace = true }
curios-abi = { workspace = true }
curios-utilities = { workspace = true }
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-pipeline = { workspace = true }
curios-prelude = { workspace = true }
curios-package = { workspace = true }
curios-archive = { workspace = true, features = ["enabled"] }
curios-unit = { workspace = true, features = ["archive"] }
curios-binaryen = { workspace = true }
# The switch that turns Cranelift on for the shared runtime engine, which is what gives `curios_runtime::precompile` its `precompile_module`. Named nowhere in this crate's code: wasmtime itself is `curios-runtime`'s to own.
curios-runtime = { workspace = true, features = ["cranelift"] }
clap = { version = "4.6.1", features = ["derive"] }

# The cross-stage suites in `src/tests` reach into individual pipeline stages; the product code never does.
[dev-dependencies]
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-cont = { workspace = true }
curios-elab = { workspace = true }
curios-ersd = { workspace = true }
