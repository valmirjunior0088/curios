[package]
name = "curios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The curios pipeline library and command-line compiler driver"

[lints]
workspace = true

[[bin]]
name = "curios"
path = "cli/main.rs"

[[bin]]
name = "profile"
path = "profile/main.rs"
required-features = ["profile"]

[features]
profile = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "curios-pipeline/profile",
]

# Lib (the pipeline facade + compile/precompile/run-from-source helpers
# + the integration suite) + bin (the clap front-end). This is the only crate
# that declares Cranelift and Binaryen, so they are confined to compiler builds.

[dependencies]
curios-abi = { workspace = true }
curios-base = { workspace = true }
curios-wasm = { workspace = true }
curios-cont = { workspace = true }
curios-ersd = { workspace = true }
curios-core = { workspace = true }
curios-text = { workspace = true }
curios-pipeline = { workspace = true }
curios-binaryen = { workspace = true }
curios-rt = { workspace = true }
wasmtime = { workspace = true, features = ["cranelift"] }
clap = { version = "4.6.1", features = ["derive"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
