[package]
name = "curios-download"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A file a build pins by its SHA-256: read where a hand placed it or an earlier run kept it, else downloaded, checked either way, and kept unpacked or as an executable"

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
# The one crate that names the HTTP client, which only the build scripts and `xtask` reach through it, so its version is stated here (`documentation/design/one-crate-is-the-authority-for-one-external-concern.md`).
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# A pinned archive unpacked, gzipped tarballs and gzipped files alike, the one place either is named.
tar = "0.4.46"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
