[package]
name = "curios-document"
description = "The documentation record of a unit for its consumers, and the pages `curios document` renders from it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
curios-archive = { workspace = true }
curios-common = { workspace = true }
askama = { workspace = true }

[dev-dependencies]
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
