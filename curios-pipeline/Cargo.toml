[package]
name = "curios-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure Curios compile driver, from surface text to a WebAssembly module"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-text/profile",
    "curios-unit/profile",
    "curios-elab/profile",
    "curios-ersd/profile",
    "curios-cont/profile",
    "curios-emit/profile",
    "curios-cert/profile",
    "curios-prelude/profile",
]

[dependencies]
curios-abi = { workspace = true }
curios-utilities = { workspace = true }
curios-cert = { workspace = true }
curios-cont = { workspace = true }
curios-emit = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-ersd = { workspace = true }
curios-profile = { workspace = true }
curios-text = { workspace = true }
curios-document = { workspace = true }
curios-unit = { workspace = true }
curios-wasm = { workspace = true }
# The standard prefix, for `standard.rs` alone: the fold itself never names it, and the boundary this
# crate keeps is against Binaryen, Wasmtime, the runtime and the CLI — none of which this is.
curios-prelude = { workspace = true }

[dev-dependencies]
# The families a unit's items declare, which the measurement over the library's families surveys. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-elab = { workspace = true, features = ["test-support"] }
# The structural digest of a module, which the erasure suite compares across two compilations. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-ersd = { workspace = true, features = ["test-support"] }
# Where the standard library is authored, for the suites that compile it from its tree.
curios-std = { workspace = true }
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-utilities = { workspace = true, features = ["test-support"] }
# The bytes a unit is stored as, which a suite compares across two compilations of it.
curios-archive = { workspace = true }
