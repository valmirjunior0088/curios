[package]
name = "curios-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure Curios compile driver, from surface text to a WebAssembly module"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-text/profile",
    "curios-unit/profile",
    "curios-elab/profile",
    "curios-ersd/profile",
    "curios-cont/profile",
    "curios-cert/profile",
    "curios-prelude/profile",
]

[dependencies]
curios-abi = { workspace = true }
curios-utilities = { workspace = true }
curios-cert = { workspace = true }
curios-cont = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-ersd = { workspace = true }
curios-profile = { workspace = true }
curios-text = { workspace = true }
curios-unit = { workspace = true }
curios-wasm = { workspace = true }
# The standard prefix, for `standard.rs` alone: the fold itself never names it, and the boundary this
# crate keeps is against Binaryen, Wasmtime, the runtime and the CLI — none of which this is.
curios-prelude = { workspace = true }
