[package]
name = "curios-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The curios pipeline: compile_entrypoint driving text -> core -> ersd -> cont -> wasm"

[lints]
workspace = true

[features]
profiling = [
    "dep:tracing",
    "curios-core/profiling",
    "curios-ersd/profiling",
    "curios-cont/profiling",
]

[dependencies]
curios-abi = { workspace = true }
curios-text = { workspace = true }
curios-core = { workspace = true }
curios-ersd = { workspace = true }
curios-cont = { workspace = true }
curios-wasm = { workspace = true }
tracing = { workspace = true, optional = true }
