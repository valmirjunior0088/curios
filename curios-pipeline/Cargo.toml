[package]
name = "curios-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure Curios compile driver, from surface text to a WebAssembly module"

[lints]
workspace = true

[features]
# `test_support`: the puts, a program handed to the checkers with the fixed prelude in scope, for `curios`'s suites that judge what the checkers judge. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = ["dep:curios-archive", "dep:curios-prelude-build"]

[dependencies]
# Where the standard library is authored, and the bytes a unit stores, for the test support's package of the library and its stored halves alone.
curios-archive = { workspace = true, optional = true }
curios-prelude-build = { workspace = true, optional = true }
curios-abi = { workspace = true }
curios-common = { workspace = true }
curios-cert = { workspace = true }
curios-cps = { workspace = true }
curios-emit = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-erase = { workspace = true }
curios-anf = { workspace = true }
curios-module = { workspace = true }
curios-surface = { workspace = true }
curios-document = { workspace = true }
curios-unit = { workspace = true }
curios-wasm = { workspace = true }
# The standard prefix, for `standard.rs` alone: the fold itself never names it, and the boundary this
# crate keeps is against Binaryen, Wasmtime, the runtime and the CLI — none of which this is.
curios-prelude = { workspace = true }

[dev-dependencies]
# Where the standard library is authored, for the suites that compile it from its tree.
curios-prelude-build = { workspace = true }
# A finished term printed as a report spells it, for the suites that print a declaration. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-elab = { workspace = true, features = ["test-support"] }
# The digest of every part a unit's items are read by. A dev-dependency entry beside the normal one, for the same reason.
curios-erase = { workspace = true, features = ["test-support"] }
# The structural digest of a module, which the erasure suite compares across two compilations. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-anf = { workspace = true, features = ["test-support"] }
# The census holding each declaration of a unit's lowering to its record and to its answers, which the suite over the library takes. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-module = { workspace = true, features = ["test-support"] }
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
# The bytes a unit is stored as, which a suite compares across two compilations of it.
curios-archive = { workspace = true }
