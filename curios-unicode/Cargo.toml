[package]
name = "curios-unicode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Unicode Character Database the toolchain pins: each scalar's properties, the extended grapheme clusters of text, and the same tables packed for /sys"

[lints]
workspace = true

[features]
# The conformance cases of `GraphemeBreakTest.txt`, for the tests of a crate that segments text by these tables in another language: `curios-prelude`'s, whose segmentation is Curios.
test-support = []

# The pinned files are fetched, checked and kept as every build script that fetches does.
[build-dependencies]
curios-download = { workspace = true }
