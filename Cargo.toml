[workspace]
resolver = "2"
members = ["curios", "curios-binaryen", "curios-runtime", "curios-compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Work-in-progress functional dependently typed programming language"

[workspace.dependencies]
curios = { path = "curios" }
curios-binaryen = { path = "curios-binaryen" }
curios-runtime = { path = "curios-runtime" }
curios-compiler = { path = "curios-compiler" }
# wasmtime's version + runtime baseline live here so they are declared once. The
# `.cwasm` format is wasmtime-version-locked, so curios-cli (which precompiles) and
# curios-run (which deserializes) must share one version; inheriting from here
# guarantees it. curios-cli adds the `cranelift` feature on top.
wasmtime = { version = "44.0.1", default-features = false, features = ["runtime", "gc", "gc-drc", "std"] }
num-bigint = { version = "0.4.6" }
num-traits = { version = "0.2.19" }
