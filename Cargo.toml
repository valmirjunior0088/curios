[workspace]
resolver = "2"
members = [
    "curios-abi",
    "curios-archive",
    "curios-archive-derive",
    "curios-utilities",
    "curios-num",
    "curios-parse",
    "curios-print",
    "curios-wasm",
    "curios-cont",
    "curios-emit",
    "curios-ersd",
    "curios-core",
    "curios-analysis",
    "curios-cert",
    "curios-elab",
    "curios-text",
    "curios-unit",
    "curios-prelude",
    "curios-prelude-archive",
    "curios-pipeline",
    "curios-package",
    "curios-verdicts",
    "curios-wonder",
    "curios-document",
    "curios-profile",
    "curios-js",
    "curios",
    "curios-binaryen",
    "curios-runtime",
    "xtask",
]
exclude = ["editors/zed"]

[workspace.package]
version = "0.14.8"
edition = "2024"
description = "The Curios programming language: a dependently typed functional language compiled to WebAssembly-GC"
license = "Apache-2.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
unused_self = "warn"

[workspace.lints.rustdoc]
all = "deny"

[workspace.dependencies]
curios-abi = { path = "curios-abi" }
curios-archive = { path = "curios-archive" }
curios-archive-derive = { path = "curios-archive-derive" }
curios-profile = { path = "curios-profile" }
curios-utilities = { path = "curios-utilities" }
curios-num = { path = "curios-num" }
curios-parse = { path = "curios-parse" }
curios-print = { path = "curios-print" }
curios-wasm = { path = "curios-wasm" }
curios-cont = { path = "curios-cont" }
curios-emit = { path = "curios-emit" }
curios-ersd = { path = "curios-ersd" }
curios-core = { path = "curios-core" }
curios-analysis = { path = "curios-analysis" }
curios-cert = { path = "curios-cert" }
curios-elab = { path = "curios-elab" }
curios-text = { path = "curios-text" }
curios-unit = { path = "curios-unit" }
curios-prelude = { path = "curios-prelude" }
curios-prelude-archive = { path = "curios-prelude-archive" }
curios-pipeline = { path = "curios-pipeline" }
curios-package = { path = "curios-package" }
curios-verdicts = { path = "curios-verdicts" }
curios-wonder = { path = "curios-wonder" }
curios-document = { path = "curios-document" }
curios-binaryen = { path = "curios-binaryen" }
curios-runtime = { path = "curios-runtime" }
# The one pair that stays, and the exception is exactly as wide as its reason. These are two
# package names taken by two different members — `curios-js` and `xtask` — whose versions must move
# together, because the CLI support crate generates the glue for the runtime crate and any skew
# breaks the bindings. A per-crate pin cannot say "these two match"; a shared row is the only thing
# that can. Every other third-party dependency names its own pin in the one crate that owns it, as
# `documentation/design/toolchain/one-crate-is-the-authority-for-one-external-concern.md` decides.
wasm-bindgen = { version = "0.2.126" }
wasm-bindgen-cli-support = { version = "0.2.126" }
