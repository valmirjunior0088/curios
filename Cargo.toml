[workspace]
resolver = "2"
members = ["curios-abi", "curios-base", "curios-wasm", "curios-cont", "curios-ersd", "curios-core", "curios-text", "curios-pipeline", "curios-web", "curios", "curios-binaryen", "curios-runtime"]

[workspace.package]
version = "0.4.0"
edition = "2024"
description = "Work-in-progress functional dependently typed programming language"
license = "Apache-2.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
unused_self = "warn"

[workspace.dependencies]
curios = { path = "curios" }
curios-abi = { path = "curios-abi" }
curios-base = { path = "curios-base" }
curios-wasm = { path = "curios-wasm" }
curios-cont = { path = "curios-cont" }
curios-ersd = { path = "curios-ersd" }
curios-core = { path = "curios-core" }
curios-text = { path = "curios-text" }
curios-pipeline = { path = "curios-pipeline" }
curios-web = { path = "curios-web" }
curios-binaryen = { path = "curios-binaryen" }
curios-runtime = { path = "curios-runtime" }
wasmtime = { version = "46.0.1", default-features = false, features = ["runtime", "gc", "gc-copying", "std"] }
num-bigint = { version = "0.5.1" }
num-traits = { version = "0.2.19" }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
