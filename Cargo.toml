[workspace]
resolver = "2"
members = [
    "curios-abi",
    "curios-archive",
    "curios-archive-derive",
    "curios-unicode",
    "curios-common",
    "curios-num",
    "curios-algebra",
    "curios-parse",
    "curios-print",
    "curios-wasm",
    "curios-cps",
    "curios-emit",
    "curios-anf",
    "curios-core",
    "curios-analysis",
    "curios-cert",
    "curios-elab",
    "curios-erase",
    "curios-surface",
    "curios-module",
    "curios-unit",
    "curios-prelude",
    "curios-pipeline",
    "curios-package",
    "curios-verdict",
    "curios-wonder",
    "curios-document",
    "curios-profile",
    "curios-browser",
    "curios-js",
    "curios",
    "curios-binaryen",
    "curios-native",
    "curios-cranelift",
    "xboard",
    "xbench",
    "xtask",
]
exclude = ["editors/zed"]

[workspace.package]
version = "0.16.20"
edition = "2024"
description = "The Curios programming language: a dependently typed functional language compiled to WebAssembly-GC"
license = "Apache-2.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
iter_over_hash_type = "warn"
unused_self = "warn"

[workspace.lints.rustdoc]
all = "deny"

[workspace.dependencies]
curios-abi = { path = "curios-abi" }
curios-archive = { path = "curios-archive" }
curios-archive-derive = { path = "curios-archive-derive" }
curios-profile = { path = "curios-profile" }
curios-unicode = { path = "curios-unicode" }
curios-common = { path = "curios-common" }
curios-num = { path = "curios-num" }
curios-algebra = { path = "curios-algebra" }
curios-parse = { path = "curios-parse" }
curios-print = { path = "curios-print" }
curios-wasm = { path = "curios-wasm" }
curios-cps = { path = "curios-cps" }
curios-emit = { path = "curios-emit" }
curios-anf = { path = "curios-anf" }
curios-core = { path = "curios-core" }
curios-analysis = { path = "curios-analysis" }
curios-cert = { path = "curios-cert" }
curios-elab = { path = "curios-elab" }
curios-erase = { path = "curios-erase" }
curios-surface = { path = "curios-surface" }
curios-module = { path = "curios-module" }
curios-unit = { path = "curios-unit" }
curios-prelude = { path = "curios-prelude" }
curios-pipeline = { path = "curios-pipeline" }
curios-package = { path = "curios-package" }
curios-verdict = { path = "curios-verdict" }
curios-wonder = { path = "curios-wonder" }
curios-document = { path = "curios-document" }
curios-browser = { path = "curios-browser" }
curios-binaryen = { path = "curios-binaryen" }
curios-native = { path = "curios-native" }
curios-cranelift = { path = "curios-cranelift" }
curios = { path = "curios" }
# One row for the engine's two crates: `curios-native` takes the runtime, `curios-cranelift` the backend, and a `.cwasm` the second writes is read back by the first, which Wasmtime refuses across versions.
wasmtime = { version = "50.0.0", default-features = false }
# One row each for the browser's two crates, `curios-js` exporting the compiler and `curios-browser` the run of what it compiles, which bind to one JavaScript side, and for the generator `xtask` writes that side's glue with. The two refuse each other across versions, and cargo holds them to one: each pins `wasm-bindgen-shared` exactly, which declares a `links` key, so the lock can hold only one version of it.
wasm-bindgen = { version = "0.2.126" }
js-sys = { version = "0.3.103" }
# Each a dependency two or more manifests take, its version stated once: `documentation/design/one-crate-is-the-authority-for-one-external-concern.md`.
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154" }
sha2 = { version = "0.11.0" }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.15" }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[profile.dev]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.test]
opt-level = 3
debug = "line-tables-only"
