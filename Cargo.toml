[workspace]
resolver = "2"
members = ["curios-abi", "curios-base", "curios-wasm", "curios-cont", "curios-ersd", "curios-core", "curios-text", "curios-pipeline", "curios-js", "curios", "curios-binaryen", "curios-rt"]

[workspace.package]
version = "0.3.5"
edition = "2024"
description = "Work-in-progress functional dependently typed programming language"
license = "Apache-2.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
unused_self = "warn"

[workspace.dependencies]
curios = { path = "curios" }
curios-abi = { path = "curios-abi" }
curios-base = { path = "curios-base" }
curios-wasm = { path = "curios-wasm" }
curios-cont = { path = "curios-cont" }
curios-ersd = { path = "curios-ersd" }
curios-core = { path = "curios-core" }
curios-text = { path = "curios-text" }
curios-pipeline = { path = "curios-pipeline" }
curios-js = { path = "curios-js" }
curios-binaryen = { path = "curios-binaryen" }
curios-rt = { path = "curios-rt" }
wasmtime = { version = "46.0.1", default-features = false, features = ["runtime", "gc", "gc-copying", "std"] }
num-bigint = { version = "0.5.1" }
num-traits = { version = "0.2.19" }
