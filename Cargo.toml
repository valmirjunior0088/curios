[workspace]
resolver = "2"
members = [
    "curios-abi",
    "curios-archive",
    "curios-archive-derive",
    "curios-unicode",
    "curios-utilities",
    "curios-num",
    "curios-algebra",
    "curios-parse",
    "curios-print",
    "curios-wasm",
    "curios-cont",
    "curios-emit",
    "curios-ersd",
    "curios-core",
    "curios-analysis",
    "curios-cert",
    "curios-elab",
    "curios-text",
    "curios-std",
    "curios-unit",
    "curios-prelude",
    "curios-prelude-archive",
    "curios-pipeline",
    "curios-package",
    "curios-verdicts",
    "curios-wonder",
    "curios-document",
    "curios-profile",
    "curios-browser",
    "curios-js",
    "curios",
    "curios-binaryen",
    "curios-native",
    "curios-cranelift",
    "xboard",
    "xbench",
]
exclude = ["editors/zed", "xtask"]

[workspace.package]
version = "0.16.10"
edition = "2024"
description = "The Curios programming language: a dependently typed functional language compiled to WebAssembly-GC"
license = "Apache-2.0"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
iter_over_hash_type = "warn"
unused_self = "warn"

[workspace.lints.rustdoc]
all = "deny"

[workspace.dependencies]
curios-abi = { path = "curios-abi" }
curios-archive = { path = "curios-archive" }
curios-archive-derive = { path = "curios-archive-derive" }
curios-profile = { path = "curios-profile" }
curios-unicode = { path = "curios-unicode" }
curios-utilities = { path = "curios-utilities" }
curios-num = { path = "curios-num" }
curios-algebra = { path = "curios-algebra" }
curios-parse = { path = "curios-parse" }
curios-print = { path = "curios-print" }
curios-wasm = { path = "curios-wasm" }
curios-cont = { path = "curios-cont" }
curios-emit = { path = "curios-emit" }
curios-ersd = { path = "curios-ersd" }
curios-core = { path = "curios-core" }
curios-analysis = { path = "curios-analysis" }
curios-cert = { path = "curios-cert" }
curios-elab = { path = "curios-elab" }
curios-text = { path = "curios-text" }
curios-std = { path = "curios-std" }
curios-unit = { path = "curios-unit" }
curios-prelude = { path = "curios-prelude" }
curios-prelude-archive = { path = "curios-prelude-archive" }
curios-pipeline = { path = "curios-pipeline" }
curios-package = { path = "curios-package" }
curios-verdicts = { path = "curios-verdicts" }
curios-wonder = { path = "curios-wonder" }
curios-document = { path = "curios-document" }
curios-browser = { path = "curios-browser" }
curios-binaryen = { path = "curios-binaryen" }
curios-native = { path = "curios-native" }
curios-cranelift = { path = "curios-cranelift" }
curios = { path = "curios" }
# One row for the engine's two crates: `curios-native` takes the runtime, `curios-cranelift` the backend, and a `.cwasm` the second writes is read back by the first, which Wasmtime refuses across versions.
wasmtime = { version = "47.0.3", default-features = false }
# One row each for the browser's two crates, `curios-js` exporting the compiler and `curios-browser` the run of what it compiles, which bind to one JavaScript side; `xtask`'s `wasm-bindgen-cli-support` generates that side's glue, and `the_bindings_generator_is_the_bindings_version` holds it to the `wasm-bindgen` row.
wasm-bindgen = { version = "0.2.126" }
js-sys = { version = "0.3.103" }

[profile.dev]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.test]
opt-level = 3
debug = "line-tables-only"
