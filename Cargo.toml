[package]
name = "curios"
version = "0.1.0"
edition = "2024"
description = "Work-in-progress functional dependently typed programming language"

[features]
run = ["dep:wasmtime"]
cli = ["dep:clap", "run"]
default = ["cli"]

[dependencies]
wasmtime = { version = "44.0.1", optional = true }
clap = { version = "4.5.60", features = ["derive"], optional = true }
num-bigint = { version = "0.4.6" }
num-traits = { version = "0.2.19" }

[dev-dependencies]
curios = { path = ".", default-features = false, features = ["run"] }
