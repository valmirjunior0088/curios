[workspace]
resolver = "2"
members = [
    "curios-abi",
    "curios-archive",
    "curios-archive-derive",
    "curios-utilities",
    "curios-num",
    "curios-parse",
    "curios-print",
    "curios-wasm",
    "curios-cont",
    "curios-ersd",
    "curios-core",
    "curios-analysis",
    "curios-cert",
    "curios-elab",
    "curios-text",
    "curios-unit",
    "curios-prelude",
    "curios-prelude-archive",
    "curios-pipeline",
    "curios-package",
    "curios-profile",
    "curios-js",
    "curios",
    "curios-binaryen",
    "curios-runtime",
]
# The Zed extension is a wasm32-wasip2 crate against Zed's own API, built by Zed from its checkout; it is a root of its own, not a member.
exclude = ["editors/zed"]

[workspace.package]
version = "0.11.0"
edition = "2024"
description = "The Curios programming language: a dependently typed functional language compiled to WebAssembly-GC"
license = "Apache-2.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
unused_self = "warn"

[workspace.dependencies]
curios-abi = { path = "curios-abi" }
curios-archive = { path = "curios-archive" }
curios-archive-derive = { path = "curios-archive-derive" }
curios-profile = { path = "curios-profile" }
curios-utilities = { path = "curios-utilities" }
curios-num = { path = "curios-num" }
curios-parse = { path = "curios-parse" }
curios-print = { path = "curios-print" }
curios-wasm = { path = "curios-wasm" }
curios-cont = { path = "curios-cont" }
curios-ersd = { path = "curios-ersd" }
curios-core = { path = "curios-core" }
curios-analysis = { path = "curios-analysis" }
curios-cert = { path = "curios-cert" }
curios-elab = { path = "curios-elab" }
curios-text = { path = "curios-text" }
curios-unit = { path = "curios-unit" }
curios-prelude = { path = "curios-prelude" }
curios-prelude-archive = { path = "curios-prelude-archive" }
curios-pipeline = { path = "curios-pipeline" }
curios-package = { path = "curios-package" }
curios-binaryen = { path = "curios-binaryen" }
curios-runtime = { path = "curios-runtime" }
