[package]
name = "curios-elab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The curios elaborator: elaboration, typing, reduction, conversion, and erasure"

[lints]
workspace = true

[features]
archive = ["dep:rkyv", "curios-abi/archive", "curios-base/archive", "curios-core/archive", "curios-ersd/archive"]
profile = ["curios-profile/enabled"]

[dependencies]
curios-profile = { workspace = true }
curios-abi = { workspace = true }
curios-base = { workspace = true }
curios-core = { workspace = true }
curios-ersd = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rkyv = { workspace = true, optional = true }
