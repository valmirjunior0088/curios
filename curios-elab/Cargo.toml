[package]
name = "curios-elab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios elaborator: elaboration, typing, conversion, universe solving, and erasure"

[lints]
workspace = true

[features]
archive = ["curios-archive/enabled", "curios-abi/archive", "curios-base/archive", "curios-core/archive", "curios-ersd/archive"]
profile = ["curios-profile/enabled", "curios-analysis/profile"]

[dependencies]
curios-archive = { workspace = true }
curios-profile = { workspace = true }
curios-abi = { workspace = true }
curios-base = { workspace = true }
curios-analysis = { workspace = true }
curios-core = { workspace = true }
curios-ersd = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
stacker = { workspace = true }

# The kernel is a *dev*-dependency, and that is the point of the split rather than
# an accident of it: three tests here put a fixture to both checkers, and a
# dev-dependency does not propagate — so nothing whose build script reaches
# elaboration reaches `curios-cert` through it. See
# `curios-prelude-archive/README.md`, "Why this is not `curios-prelude`".
[dev-dependencies]
curios-cert = { workspace = true }
