[package]
name = "curios-elab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios elaborator: elaboration, typing, conversion and universe solving"

[lints]
workspace = true

[features]
profile = ["curios-profile/enabled", "curios-analysis/profile"]
# `test_support`: a finished term printed as a report spells it, for `curios-pipeline`'s suites that print a declaration; and for `curios-erase`'s suite, the discharged bound a fold stands in, a reader with nothing in scope, and what a reading spends. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate's tests — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

[dependencies]
curios-archive = { workspace = true }
curios-profile = { workspace = true }
curios-abi = { workspace = true }
curios-utilities = { workspace = true }
curios-analysis = { workspace = true }
curios-algebra = { workspace = true }
curios-core = { workspace = true }
curios-num = { workspace = true }

# The kernel is a *dev*-dependency, and that is the point of the split rather than an accident of it: the tests here that put a fixture to both checkers name it, and a dev-dependency does not propagate — so nothing whose build script reaches elaboration reaches `curios-cert` through it. See `curios-prelude-archive/README.md`, "This is not `curios-prelude`, and it never reaches the kernel".
[dev-dependencies]
# `declaring`, by which a fixture's module declares the entries it names: each carried by the definition of its name, or by the former it spells.
curios-core = { workspace = true, features = ["test-support"] }
curios-cert = { workspace = true }
# The shared syntax-registry stand-in in `curios_analysis::fixture`, which every context this crate's tests build is handed. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-analysis = { workspace = true, features = ["test-support"] }
