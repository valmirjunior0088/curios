[package]
name = "curios-erase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios erasure: a certified Core unit lowered into the erased IR, curios-anf"

[lints]
workspace = true

[features]
profile = ["curios-profile/enabled", "curios-elab/profile", "curios-cert/profile"]
# `test_support`: the families a unit's items declare, as each declaring item erased them, and the digest of every part a unit's items are read by, for the suites of `curios-pipeline` and `curios` that pin what erasure built. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate's tests — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

[dependencies]
curios-abi = { workspace = true }
curios-analysis = { workspace = true }
curios-anf = { workspace = true }
curios-archive = { workspace = true }
# The kernel that certified a unit, which erasure reads every type it is directed by through (`Reader`).
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-num = { workspace = true }
curios-profile = { workspace = true }
curios-utilities = { workspace = true }

[dev-dependencies]
# The discharged bound a fold stands in, which this crate's suite takes. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-elab = { workspace = true, features = ["test-support"] }
# What a reading through the kernel spends, which this crate's suite measures. A dev-dependency entry beside the normal one, for the same reason.
curios-cert = { workspace = true, features = ["test-support"] }
# The shared syntax-registry stand-in in `curios_analysis::fixture`, which every reader this crate's tests build is handed. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-analysis = { workspace = true, features = ["test-support"] }
# The fixture builders the suite declares its units with (`curios_core::test_support`). A dev-dependency entry beside the normal one, for the same reason.
curios-core = { workspace = true, features = ["test-support"] }
# The structural digest of a module, which the erasure suite pins. A dev-dependency entry beside the normal one, for the same reason.
curios-anf = { workspace = true, features = ["test-support"] }
