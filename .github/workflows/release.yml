name: Release

on:
  push:
    tags:
      - "release/*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: curios
            asset: curios-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: curios
            asset: curios-linux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-14
            binary: curios
            asset: curios-macos-aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          make curios/runtime CURIOS_RUNTIME_TARGET_TRIPLE=${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --package curios

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  build-wasm:
    name: Build curios-web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build curios-web
        run: make curios/web

      - name: Archive package
        run: tar -czf curios-web.tar.gz -C target/curios/wasm32-unknown-unknown .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: curios-web
          path: curios-web.tar.gz

  build-docs:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: Build runtime launcher
        run: make curios/runtime

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Add docs root redirect
        run: echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=curios/index.html">' > target/doc/index.html

      - name: Archive docs
        run: tar -czf curios-docs.tar.gz -C target/doc .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: curios-docs
          path: curios-docs.tar.gz

  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build, build-wasm, build-docs]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/curios-linux-x86_64/curios curios-linux-x86_64
          mv artifacts/curios-linux-aarch64/curios curios-linux-aarch64
          mv artifacts/curios-macos-aarch64/curios curios-macos-aarch64
          mv artifacts/curios-web/curios-web.tar.gz curios-web.tar.gz
          mv artifacts/curios-docs/curios-docs.tar.gz curios-docs.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            curios-linux-x86_64 \
            curios-linux-aarch64 \
            curios-macos-aarch64 \
            curios-web.tar.gz \
            curios-docs.tar.gz
