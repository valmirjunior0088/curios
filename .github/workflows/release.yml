name: Release

on:
  push:
    tags:
      - "release/*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: curios-compiler
            runtime: curios-runtime
            asset: curios-linux-x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            binary: curios-compiler
            runtime: curios-runtime
            asset: curios-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: curios-compiler.exe
            runtime: curios-runtime.exe
            asset: curios-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build the slim launcher first and embed it (mirrors the Makefile; done
      # inline so it works on the Windows runner, which has no `make`). The
      # compiler then bundles this stub into every executable it emits, so the
      # released `curios-compiler` is fully self-contained.
      - name: Build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p curios-runtime
          cp target/${{ matrix.target }}/release/${{ matrix.runtime }} curios-compiler/src/runtime
          cargo build --release --target ${{ matrix.target }} -p curios-compiler

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/curios-linux-x86_64/curios-compiler curios-linux-x86_64
          mv artifacts/curios-macos-aarch64/curios-compiler curios-macos-aarch64
          mv artifacts/curios-windows-x86_64.exe/curios-compiler.exe curios-windows-x86_64.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            curios-linux-x86_64 \
            curios-macos-aarch64 \
            curios-windows-x86_64.exe
