name: Release

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            asset: curios-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: curios-linux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: curios-macos-aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts

      - name: Build
        run: |
          make curios/runtime CURIOS_RUNTIME_TARGET_TRIPLE=${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --package curios

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/curios
          retention-days: 1

  wasm:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build curios-js
        run: make curios/js

      - name: Archive package
        run: tar -czf curios-js.tar.gz -C curios-js/.artifacts/wasm32-unknown-unknown .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: curios-js
          path: curios-js.tar.gz
          retention-days: 1

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts

      - name: Build runtime launcher
        run: make curios/runtime

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Add docs root redirect
        run: echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=curios/index.html">' > target/doc/index.html

      - name: Archive docs
        run: tar -czf curios-docs.tar.gz -C target/doc .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: curios-docs
          path: curios-docs.tar.gz
          retention-days: 1

  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [native, wasm, docs]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/curios-linux-x86_64/curios curios-linux-x86_64
          mv artifacts/curios-linux-aarch64/curios curios-linux-aarch64
          mv artifacts/curios-macos-aarch64/curios curios-macos-aarch64
          mv artifacts/curios-js/curios-js.tar.gz curios-js.tar.gz
          mv artifacts/curios-docs/curios-docs.tar.gz curios-docs.tar.gz

      # The installer's version is baked in here rather than discovered at run time, so the script a release ships installs that release's binary and a pinned URL stays pinned. The template is rendered to a fresh file rather than edited in place: what ships is a build product, never a mutated checkout.
      - name: Prepare installer
        run: |
          sha256sum curios-linux-x86_64 curios-linux-aarch64 curios-macos-aarch64 > checksums.txt
          sed "s/@VERSION@/${GITHUB_REF_NAME#release/}/" .github/workflows/install.sh.in > install.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            curios-linux-x86_64 \
            curios-linux-aarch64 \
            curios-macos-aarch64 \
            curios-js.tar.gz \
            curios-docs.tar.gz \
            checksums.txt \
            install.sh
