name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Run `fmt`
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            target/curios
            target/binaryen
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  check:
    name: Run `check`
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            target/curios
            target/binaryen
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run cargo check
        run: cargo check --all-targets --all-features

  clippy:
    name: Run `clippy`
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            target/curios
            target/binaryen
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Run `test`
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: clippy
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            target/curios
            target/binaryen
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run tests
        run: cargo test --all-targets --all-features

  wasm:
    name: Build curios-web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
          cache-directories: |
            target/curios
            target/binaryen
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build curios-web
        run: make curios/web
