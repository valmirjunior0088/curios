name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Run `fmt`
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  check:
    name: Run `check`
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

  clippy:
    name: Run `clippy`
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

  test:
    name: Run `test`
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  doc:
    name: Run `doc`
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run cargo doc
        run: cargo doc --workspace --no-deps

  wasm:
    name: Build `curios-js`
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build curios-js
        run: make curios/js
