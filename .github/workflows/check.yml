name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Run rustfmt
        run: cargo xtask fmt-check

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo xtask runtime
      - name: Run Clippy
        run: cargo xtask clippy

  tests:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo xtask runtime
      - name: Run tests
        run: cargo xtask test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The native host's macOS branches — the serial speed ioctl, the modem-line opcodes, the device listing — are compiled by no Linux job, and the release workflow would be the first to meet them. The runtime's tests need neither the launcher nor Binaryen.
  tests-curios-runtime-macos:
    name: Tests (`curios-runtime`) (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-macos
      - name: Run the runtime's tests
        run: cargo xtask test curios-runtime

  doctests:
    name: Doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo xtask runtime
      - name: Run doctests
        run: cargo xtask doctest

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build docs
        run: cargo xtask docs

  wasm:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - name: Build curios-js and run its Node suite
        run: cargo xtask js-test

  grammar:
    name: Grammar parser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/grammar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Install dependencies
        run: cargo xtask grammar-install
      - name: Run grammar tests
        run: cargo xtask grammar-test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Install dependencies
        run: cargo xtask vscode-install
      - name: Run grammar snapshot tests
        run: cargo xtask vscode-test
      - name: Build the extension
        run: cargo xtask vscode-build

  zed:
    name: Zed extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            .
            editors/zed
      - name: Run rustfmt
        run: cargo xtask zed-fmt-check
      - name: Run Clippy
        run: cargo xtask zed-clippy
      - name: Build extension
        run: cargo xtask zed-build
      - name: Check the grammar rev publishes this grammar
        run: cargo xtask zed-test
