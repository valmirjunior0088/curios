name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  compile:
    name: Compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo x runtime
      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo x runtime
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo x runtime
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Run doctests
        run: cargo test --workspace --doc --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: cargo x runtime
      - name: Run cargo doc
        run: cargo doc --workspace --no-deps

  wasm:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - name: Build curios-js
        run: cargo x js

  grammar:
    name: Grammar parser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/grammar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Install dependencies
        run: cargo x grammar ci
      - name: Run grammar tests
        run: cargo x grammar test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Install dependencies
        run: cargo x vscode ci
      - name: Run grammar snapshot tests
        run: cargo x vscode test
      - name: Package the extension
        run: cargo x vscode run package

  zed:
    name: Zed extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Check the grammar rev publishes this grammar
        run: |
          rev=$(sed -n 's/^rev = "\(.*\)"/\1/p' editors/zed/extension.toml)
          git fetch --depth=1 origin "$rev"
          pinned=$(git rev-parse "${rev}:editors/grammar")
          here=$(git rev-parse HEAD:editors/grammar)
          if [ "$pinned" != "$here" ]; then
            echo "editors/zed/extension.toml pins $rev, holding grammar tree $pinned, but this tree holds $here"
            echo "commit and push editors/grammar, then move the rev"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            .
            editors/zed
      - name: Run rustfmt
        run: cargo x zed fmt --all -- --check
      - name: Run Clippy
        run: cargo x zed clippy --target wasm32-wasip2 -- -Dwarnings
      - name: Build extension
        run: cargo x zed build --release --target wasm32-wasip2
