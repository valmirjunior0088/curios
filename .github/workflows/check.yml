name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  compile:
    name: Compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build runtime launcher
        run: make curios/runtime
      - name: Run cargo doc
        run: cargo doc --workspace --no-deps

  wasm:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build curios-js
        run: make curios/js

  grammar:
    name: Grammar parser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/grammar/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: editors/grammar
      - name: Run grammar tests
        run: npm test
        working-directory: editors/grammar

  textmate:
    name: TextMate grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: editors/vscode
      - name: Run grammar snapshot tests
        run: npm test
        working-directory: editors/vscode
