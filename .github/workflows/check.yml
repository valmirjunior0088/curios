name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST: nextest@0.9.146

# A job sets up a machine and runs steps of one subject, each a `cargo xtask` line. Which steps there are, and what each runs, is the table's in `xtask/src/steps.rs`; `every_step_has_a_job` there holds that these lines parse and together run every step. The toolchain is the one `rust-toolchain.toml` pins and Node the one `.node-version` names, so no job names a version of either.
jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.NEXTEST }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Check formatting
        run: cargo xtask workspace format --check
      - name: Lint
        run: cargo xtask workspace lint
      - name: Test
        run: cargo xtask workspace test

  # The native host's macOS branches — the serial speed ioctl, the modem-line opcodes, the device listing — are compiled by no Linux job, and the release workflow would be the first to meet them. The runtime's lint and tests need neither the launcher nor Binaryen.
  workspace-macos:
    name: Workspace (`curios-runtime`) (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.NEXTEST }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-macos
      - name: Lint the runtime
        run: cargo xtask workspace lint curios-runtime
      - name: Test the runtime
        run: cargo xtask workspace test curios-runtime

  instrumented:
    name: Instrumented
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.NEXTEST }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: instrumented
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Lint
        run: cargo xtask instrumented lint

  compiler:
    name: Compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.NEXTEST }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: compiler
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build
        run: cargo xtask compiler build

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build
        run: cargo xtask docs build

  bundle:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - name: Build
        run: cargo xtask bundle build
      - name: Test
        run: cargo xtask bundle test

  grammar:
    name: Grammar parser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: editors/grammar/package-lock.json
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Install
        run: cargo xtask grammar install
      - name: Check formatting
        run: cargo xtask grammar format --check
      - name: Lint
        run: cargo xtask grammar lint
      - name: Test
        run: cargo xtask grammar test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - name: Install
        run: cargo xtask vscode install
      - name: Check formatting
        run: cargo xtask vscode format --check
      - name: Lint
        run: cargo xtask vscode lint
      - name: Test
        run: cargo xtask vscode test
      - name: Build
        run: cargo xtask vscode build

  zed:
    name: Zed extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            .
            editors/zed
      - name: Check formatting
        run: cargo xtask zed format --check
      - name: Lint
        run: cargo xtask zed lint
      - name: Build
        run: cargo xtask zed build
      - name: Check the extension against the tree
        run: cargo xtask zed test
