name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A job sets up a machine and runs tasks of one subject, each a `cargo xtask` line, which runs first what its steps require and consume. Which steps there are, and what each runs, is the task files' in `xtask/tasks.toml` and `xtask/tasks/`; `every_step_the_handoff_runs_has_a_job` there holds that these lines parse and together run every step the handoff runs. A subject's `lint` holds its formatting, so no line writes or checks it apart. The toolchain is the one `rust-toolchain.toml` pins, so no job names a version of it, and it is the one thing a job installs: every other tool a step runs is fetched by the run at the digest the task files state and kept in `xtask/.artifacts`, which a job caches.
jobs:
  compiler:
    name: Compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
            xtask/.artifacts
      - name: Lint
        run: cargo xtask compiler lint
      - name: Test
        run: cargo xtask compiler test
      - name: Caches
        run: cargo xtask compiler caches

  # The native host's macOS branches — the serial speed ioctl, the modem-line opcodes, the device listing — are compiled by no Linux job, and the release workflow would be the first to meet them. The runtime's lint and tests need neither the launcher nor Binaryen.
  native-macos:
    name: Native host (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-macos
          workspaces: .
          cache-directories: |
            xtask/.artifacts
      - name: Lint the runtime
        run: cargo xtask native lint
      - name: Test the runtime
        run: cargo xtask native test

  distribution:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: distribution
          workspaces: .
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
            xtask/.artifacts
      - name: Build
        run: cargo xtask distribution build
      - name: Test
        run: cargo xtask distribution test

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          workspaces: .
          cache-directories: |
            curios/.artifacts
            curios-binaryen/.artifacts
      - name: Build
        run: cargo xtask docs build

  bundle:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
          workspaces: .
          cache-directories: |
            xtask/.artifacts
      - name: Build
        run: cargo xtask bundle build
      - name: Test
        run: cargo xtask bundle test

  biome:
    name: JavaScript, JSON and CSS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          workspaces: .
          cache-directories: |
            xtask/.artifacts
      - name: Lint
        run: cargo xtask biome lint

  tree-sitter:
    name: Tree-sitter grammars
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          workspaces: .
          cache-directories: |
            xtask/.artifacts
      - name: Test
        run: cargo xtask tree-sitter test

  textmate:
    name: TextMate grammars
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          workspaces: .
          cache-directories: |
            xtask/.artifacts
            ~/.npm
      - name: Test
        run: cargo xtask textmate test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          workspaces: .
          cache-directories: |
            xtask/.artifacts
            ~/.npm
      - name: Build
        run: cargo xtask vscode build

  zed:
    name: Zed extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            .
            editors/zed
          cache-directories: |
            xtask/.artifacts
      - name: Lint
        run: cargo xtask zed lint
      - name: Build
        run: cargo xtask zed build
      - name: Check the extension against the tree
        run: cargo xtask zed check

  jig:
    name: Jig
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: jig
          workspaces: .
          cache-directories: |
            xtask/.artifacts
      - name: Lint
        run: cargo xtask jig lint
      - name: Test
        run: cargo xtask jig test
      - name: Check the agent files against the tree
        run: cargo xtask jig agents
