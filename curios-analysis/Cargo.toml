[package]
name = "curios-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The analyses both Curios checkers run: the Env/Judge seam, index inversion, strict positivity, size-change totality, and universe satisfiability"

[lints]
workspace = true

[features]
profile = ["curios-profile/enabled", "curios-core/profile"]
# The shared `/syn` registry stand-in both checkers' tests are built against, in `fixture`. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to `curios-cert`'s and `curios-elab`'s tests — the same reason `curios-runtime`'s `test-support` is a feature. **Never add this to `default`.** The module spells `/syn` names, and the gate is what keeps them out of every build that ships.
test-support = []

[dependencies]
curios-profile = { workspace = true }
curios-utilities = { workspace = true }
curios-core = { workspace = true }
curios-num = { workspace = true }

# The kernel, for the tests in `tests/` that drive these analyses through a real
# checker. It is a cycle — `curios-cert` depends on this crate — and Cargo permits
# it because dev-dependencies do not participate in the library build. It works for
# *integration* tests only: a `#[cfg(test)]` module inside the lib compiles this
# crate a second time, so `Kernel`'s `Judge` implementation would be against the
# other copy and the bound would not hold.
[dev-dependencies]
curios-cert = { workspace = true }
# This crate on itself, only to turn `test-support` on for its own tests: `tests/driven.rs`
# links the library as an external crate, so `#[cfg(test)]` inside the lib would not reach it
# and the feature is the only switch that does.
curios-analysis = { path = ".", features = ["test-support"] }
