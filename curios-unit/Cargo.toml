[package]
name = "curios-unit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios compilation unit: what one unit provides to its successors, and the prefix of predecessors each stage is compiled against"

[lints]
workspace = true

[features]
profile = [
    "curios-elab/profile",
    "curios-erase/profile",
    "curios-anf/profile",
    "curios-module/profile",
]

# `test_support` and `Unit::with_certification`: a record of what was read filed whole, which `curios-pipeline`'s measurement of the prelude's image reads, and a unit holding another record, how the soundness board's histories withhold one. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

[dependencies]
curios-abi = { workspace = true }
curios-archive = { workspace = true }
curios-common = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-erase = { workspace = true }
curios-anf = { workspace = true }
curios-module = { workspace = true }
