[package]
name = "curios-module"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios module system: loading, module resolution, lints, the registry of compiler-known names, and lowering the surface tree to Core"

[lints]
workspace = true

[features]
profile = ["curios-profile/enabled", "curios-parse/profile", "curios-surface/profile"]

# `RootSource::core_text`: a unit written as Core text, logged as read, for the soundness board's histories. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

[dependencies]
curios-archive = { workspace = true }
curios-document = { workspace = true }
curios-profile = { workspace = true }
curios-abi = { workspace = true }
# The Unicode tables `/sys/unicode` bakes.
curios-common = { workspace = true }
curios-parse = { workspace = true }
curios-print = { workspace = true }
curios-core = { workspace = true }
curios-num = { workspace = true }
curios-surface = { workspace = true }

[dev-dependencies]
# `curios_core::test_support::into_nested_term`, which the lowering suite folds a finished module with. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-core = { workspace = true, features = ["test-support"] }
# The elaborator the lowering suites run their output through: `into_core/test_support.rs` checks what a lowering produced. A dev-dependency, because the lowering itself builds terms with `curios-core`'s constructors and never names the elaborator.
curios-elab = { workspace = true }
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
