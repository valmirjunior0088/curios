[package]
name = "xbench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The benchmark bench: Curios and Rust on the measurement corpus, held to one answer and timed, as records of what each sitting was taken under"
publish = false
# `cargo xbench` runs the bench; `twin`, the runner `rust-wasm` runs under, is started by the contest alone.
default-run = "xbench"

[lints]
workspace = true

# The bench drives other languages' compilers, a timer and an instruction count, and names of the workspace's only the instruments it reads.
[dependencies]
# The instructions each contestant retires, `Instructions`, opened before it starts and inherited into it.
curios-profile = { workspace = true }
# The command line, in `xtask`'s own convention.
clap = { workspace = true }
# A record is a TOML file beside the code, read where the bench runs and printed where a sitting files one.
serde = { workspace = true }
toml = { workspace = true, features = ["display"] }
# The engine `rust-wasm` runs under, the one `Cargo.lock` resolves for the compiler's own, so the two WebAssembly contestants run under one engine by construction: the twin runner compiles the twin's component and runs it.
wasmtime = { workspace = true, features = ["cranelift", "component-model", "runtime", "std"] }
# What a twin built for `wasm32-wasip2` is handed by its runner: its arguments and its standard streams, through the second preview alone, the one a `wasip2` component imports.
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2"] }
