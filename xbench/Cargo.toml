[package]
name = "xbench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The benchmark bench: Curios and Rust on the measurement corpus, held to one answer and timed, as records of what each sitting was taken under"
publish = false
# `cargo xbench` runs the bench; `twin`, the runner `rust-wasm` runs under, is started by the contest alone.
default-run = "xbench"

[lints]
workspace = true

# The bench drives other languages' compilers, a timer and an instruction count, and the workspace's compiler in its own process, through its public entries and the test support its crates keep for another's tests, as `xboard` drives the checkers.
[dependencies]
# The compiler its measurements drive, its test support with it: the launcher image a bundled executable is built from, and a program compiled and run in this process as the compiler's suites compile and run one.
curios = { workspace = true, features = ["test-support"] }
# The field shapes an ANF module settles on, which the census of shapes reads.
curios-anf = { workspace = true }
# The bytes a stored unit is archived as, which the standard library's image division weighs.
curios-archive = { workspace = true }
# The certifier, which the stored prelude's measurement puts the library's definitions to again.
curios-cert = { workspace = true }
# The arena ids a CPS module's nodes are keyed by, which the census walks, and its test support's `fill!`, which spells the programs a reduction measurement grows.
curios-common = { workspace = true, features = ["test-support"] }
# The look count the checkers' walks keep, which the towers and the growths read, and its test support: the closed machine's host, which the machine's spend is read through.
curios-core = { workspace = true, features = ["test-support"] }
# The optimized CPS module the census surveys.
curios-cps = { workspace = true }
# Cranelift's compile of a module Binaryen never saw, which the ladder runs raw.
curios-cranelift = { workspace = true }
# The budget a measurement compiles under, the elaborator's, and the elaboration the standard library's censuses read of a recompile.
curios-elab = { workspace = true }
# Erasure, its test support with it: what the stored prelude erases, and the erased units the standard library's censuses read.
curios-erase = { workspace = true, features = ["test-support"] }
# The empty root a loose program is compiled against.
curios-module = { workspace = true }
# The engine a program runs on, its test support with it: the host a run is answered by, and what the collector did over it.
curios-native = { workspace = true, features = ["test-support"] }
# The fold a measurement compiles a program through, the fixed prelude in front of it, and its test support: the puts, and the standard library's tree and edits.
curios-pipeline = { workspace = true, features = ["test-support"] }
# The prelude's units, its test support with it: the certified library the prelude's measurements read whole.
curios-prelude = { workspace = true, features = ["test-support"] }
# The standard library's sources, whose written sites the allowance's classification reads.
curios-prelude-build = { workspace = true }
# The instructions each contestant retires, `Instructions`, opened before it starts and inherited into it.
curios-profile = { workspace = true }
# The program a measurement's text is parsed as.
curios-surface = { workspace = true }
# The unit a build files, its test support with it: the halves and packs the standard library's censuses divide.
curios-unit = { workspace = true, features = ["test-support"] }
# A module's bytes and the names it is printed with, which the structural surveys and the ladder read as text.
curios-wasm = { workspace = true }
# The questions `wonder` answers, through whose diagnostics the allowance's classification is read.
curios-wonder = { workspace = true }
# The command line, in `xtask`'s own convention.
clap = { workspace = true }
# A record is a TOML file beside the code, read where the bench runs and printed where a sitting files one.
serde = { workspace = true }
toml = { workspace = true, features = ["display"] }
# What cargo says of what it builds, read by the runner to find the release build of the bench it sits a measurement in.
serde_json = { workspace = true }
# The engine `rust-wasm` runs under, the one `Cargo.lock` resolves for the compiler's own, so the two WebAssembly contestants run under one engine by construction: the twin runner compiles the twin's component and runs it.
wasmtime = { workspace = true, features = ["cranelift", "component-model", "runtime", "std"] }
# What a twin built for `wasm32-wasip2` is handed by its runner: its arguments and its standard streams, through the second preview alone, the one a `wasip2` component imports.
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2"] }
