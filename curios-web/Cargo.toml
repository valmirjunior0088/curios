[package]
name = "curios-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios browser boundary: wasm-bindgen compiler exports and the JavaScript run harness"

[lints]
workspace = true

[features]
profile = ["curios-pipeline/profile"]

# cdylib for the wasm-bindgen build; rlib so `cargo test -p curios-web` still has something to link against.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
curios-abi = { workspace = true }
curios-text = { workspace = true }
curios-pipeline = { workspace = true }
curios-prelude = { workspace = true }
curios-unit = { workspace = true }
curios-wasm = { workspace = true }
curios-cont = { workspace = true }
wasm-bindgen = { version = "0.2.126" }
js-sys = { version = "0.3.103" }

[dev-dependencies]
curios-runtime = { workspace = true }
wasmtime = { workspace = true, features = ["cranelift"] }
