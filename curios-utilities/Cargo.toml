[package]
name = "curios-utilities"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Foundational utilities shared across every Curios stage: spans, names, entropy, the typed arena, and packed values"

[lints]
workspace = true

[features]
archive = ["curios-archive/enabled"]
# `test_support`'s `Temporary`, the directory of its own a test that touches the disk works in, removed when dropped. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate's tests — the same reason `curios-runtime`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

# The one SHA-256 authority: every content digest, store key and tree hash is spelled through
# `digest.rs`, so nothing above this crate names `sha2`.
[dependencies]
curios-archive = { workspace = true }
stacker = { version = "0.1.25" }
sha2 = "0.11.0"
