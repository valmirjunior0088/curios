[package]
name = "curios-surface"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios written form: the tree a file is read into, its parser, the printer that writes it back as written, the formatter, the translation of a Core term back to the tree, and Core's printer with the naming policy terms are spelled by"

[lints]
workspace = true

[features]
profile = ["curios-profile/enabled", "curios-parse/profile"]
# `test_support`: the reader's refusals by name, which the soundness board's records name a refusal by. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = ["curios-common/test-support"]

[dependencies]
curios-abi = { workspace = true }
curios-archive = { workspace = true }
curios-common = { workspace = true }
curios-core = { workspace = true }
curios-num = { workspace = true }
curios-parse = { workspace = true }
curios-print = { workspace = true }
curios-profile = { workspace = true }

[dev-dependencies]
# `variants!`, by which the test support names the reader's refusals. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-common = { workspace = true, features = ["test-support"] }
