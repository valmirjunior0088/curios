[package]
name = "curios-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The curios core language: elaboration, typing, reduction, conversion, and erasure"

[lints]
workspace = true

[features]
archive = ["dep:rkyv", "curios-abi/archive", "curios-base/archive", "curios-ersd/archive"]
profile = ["dep:tracing"]

[dependencies]
curios-abi = { workspace = true }
curios-base = { workspace = true }
curios-ersd = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rkyv = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1.1.0" }
