title = "A family of a unit with no vector on record digests alike whatever its vector, so a verdict a cabinet filed composes through one that moved"
reason = "A unit in scope whose record does not answer for every name it holds is unrepresentable in the compiler: a unit is made of its walk's accepted answer whole, and the certifier reads a mounted record per name, so no walk computes a vector its unit's record does not file."

[[witness]]
what = "`X` accepted through `F` while `F`'s vector, computed where `/lib` is mounted, was positive, then taken from the cabinet where it is negative"
step = [
    { mount = "/base", source = "base_pos.crs" },
    { mount = "/lib", source = "lib.crs" },
    { withhold = "/lib" },
    { mount = "/app", source = "app_x.crsc" },
    { mount = "/app", source = "app_none.crsc" },
    { mount = "/base", source = "base_neg.crs" },
    { withhold = "/lib" },
    { mount = "/app", source = "app_x.crsc" },
    { source = "proof.crsc" },
]
refused = [{ by = "certifier", error = "NotPositive", within = "/app/X" }]
