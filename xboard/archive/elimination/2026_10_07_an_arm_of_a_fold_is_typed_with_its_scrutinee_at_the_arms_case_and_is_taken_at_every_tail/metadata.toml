title = "An arm of a fold is typed with its scrutinee at the arm's case, and is taken at every tail"
reason = "Folds are gone from the language: a `Nat`, `List` or `Bytes` arm binds no induction hypothesis, so every such match is a case split taken once, at its scrutinee, and induction is a recursion the size-change check grades."

[[witness]]
what = "a fold whose identity arm is a hypothesis about its scrutinee, false at zero"
source = "an_identity_arm_reads_its_scrutinee_at_zero.crs"

[[witness]]
what = "a fold whose cons arm reads a hypothesis about its scrutinee beside the one at the tail"
source = "a_cons_arm_reads_its_scrutinee_at_a_successor.crs"

[[witness]]
what = "the fold over a call, whose equation is recorded and not substituted"
source = "an_identity_arm_reads_a_call_at_zero.crs"

[[witness]]
what = "the fold over a list, whose identity arm reads its length at the empty one"
source = "an_identity_arm_reads_a_list_at_the_empty_one.crs"

[[witness]]
what = "the fold whose identity arm is a hypothesis about its scrutinee, as a term"
source = "an_identity_arm_typed_at_zero.crsc"
