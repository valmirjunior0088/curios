[package]
name = "curios-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The runtime-only Curios engine: .cwasm deserialization, host bindings, and the slim launcher"

[lints]
workspace = true

# Lib (the engine/host API, reused by curios) + bin (the launcher stub).
# Declares no compile-ish feature and never names Cranelift or Binaryen: building
# `-p curios-runtime` yields a slim, runtime-only launcher.

[dependencies]
curios-abi = { workspace = true }        # for the host<->guest wire ABI constants
wasmtime = { workspace = true }          # runtime baseline only (no cranelift)
num-bigint = { workspace = true }
getrandom = { version = "0.4.3" }
socket2 = { version = "0.6.4" }
rustix = { version = "1.1.4", features = ["event"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2.2.0" }
webpki-roots = { version = "1.0.8" }
