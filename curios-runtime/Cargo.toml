[package]
name = "curios-runtime"
version.workspace = true
edition.workspace = true
description = "Runtime-only curios engine (deserialize + host stack) and the launcher stub"

# Lib (the engine/host API, reused by curios-compiler) + bin (the launcher stub).
# Declares no compile-ish feature and never names Cranelift or Binaryen: building
# `-p curios-runtime` yields a slim, runtime-only launcher.

[dependencies]
curios-abi = { workspace = true }        # for the host<->guest wire ABI constants
wasmtime = { workspace = true }          # runtime baseline only (no cranelift)
num-bigint = { workspace = true }
getrandom = { version = "0.3.3" }
socket2 = { version = "0.5.8" }
rustix = { version = "1.1.4", features = ["event"] }
rustls = { version = "0.23.5", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2.1.2" }
webpki-roots = { version = "0.26.1" }
