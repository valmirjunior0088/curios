what = "The native host alone, for a machine that checks only it, as the macOS job does"

[lint]
what = "Lint every target of the native host as it ships: a build of that one crate, which embeds no launcher"
run = [
    ["cargo", "clippy", "--package", "curios-native", "--all-targets", "--keep-going"],
]

[test]
what = "Run the native host's tests as it ships: a build of that one crate"
run = [
    ["{.tools.cargo-nextest}", "nextest", "run", "--package", "curios-native", "--all-targets", "--no-fail-fast", "--no-tests=warn"],
]
