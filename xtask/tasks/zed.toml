what = "The Zed extension, a workspace of its own"

# Each grammar `extension.toml` pins, by the revision Zed installs it from and the directory at that revision, read where the manifest states them; and the script that holds the pins to the tree.
scripts.pins = "xtask/tasks/zed/pins.sh"
curios-rev.read = "editors/zed/extension.toml"
curios-rev.key = "grammars.curios.rev"
curios-path.read = "editors/zed/extension.toml"
curios-path.key = "grammars.curios.path"
curios-core-rev.read = "editors/zed/extension.toml"
curios-core-rev.key = "grammars.curios_core.rev"
curios-core-path.read = "editors/zed/extension.toml"
curios-core-path.key = "grammars.curios_core.path"

[lint]
what = "Hold the Zed extension's Rust to its formatting and its lints"

[lint.rustfmt]
what = "Fail on formatting drift in the Zed extension"
run = [
    { in = "editors/zed", do = ["cargo", "fmt", "--all", "--", "--check"] },
]

[lint.clippy]
what = "Lint every target of the Zed extension, for the target Zed loads"
run = [
    { in = "editors/zed", do = ["cargo", "clippy", "--all-targets", "--target", "wasm32-wasip2"] },
]

[build]
what = "Link the Zed extension into the wasm32-wasip2 component Zed loads, which the lint's check build and the test's host build never do"
run = [
    { in = "editors/zed", do = ["cargo", "build", "--release", "--target", "wasm32-wasip2"] },
]

[check]
what = "Hold the grammar revisions the Zed extension pins to the grammars this tree holds: each publishes, at its revision, the directory on disk"
# The directory on disk is read after the parsers there are generated. The extension's two other copies, Curios/Core's highlight query opening with the program's and the lint table restating the workspace's, are kept equal by hand.
consumes = [".tree-sitter.build.curios.produces.parser", ".tree-sitter.build.curios-core.produces.parser"]
run = [
    ["sh", "{.zed.scripts.pins}", "{.zed.curios-rev}", "{.zed.curios-path}", "{.zed.curios-core-rev}", "{.zed.curios-core-path}"],
]
