description = "The jig's own crates, whose names start with x: these task files' runner, the bench and the board"

[lint]
description = "Lint every target of the jig's crates, which the compiler's lint leaves out: a crate of the jig reaches the compiler's builds only as the bench's library, a dev-dependency of the crates that hold measurements, its dependencies with it"
run = [
    ["cargo", "clippy", "--package", "x*", "--all-targets", "--keep-going"],
]

[test]
description = "Run the jig's tests: these task files held to the command line and the check workflow, the runner's own, the bench's and the board's"
run = [
    ["{.tools.cargo-nextest}", "nextest", "run", "--package", "x*", "--all-targets", "--no-fail-fast"],
]

[agents]
description = "Hold the agent files, CLAUDE.md and every Markdown file under .claude/, to the tree: each glob of a rule matches a tracked file, and each link, path and source name they cite is there"
run = [{ check = "agents" }]
