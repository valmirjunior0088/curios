description = "The tree-sitter grammars"
# What the grammars are held to parse, as git tracks it, from the repository's root: the standard library's and the corpus's programs, and the board's Curios/Core.
variables.programs.run = ["git", "ls-files", "--", "curios-prelude-build/std/*.crs", "programs/*.crs"]
variables.core.run = ["git", "ls-files", "--", "xboard/tickets/*.crsc"]

[build]
description = "Generate each grammar's parser where the repository commits it, and compile it for the steps that parse with it"

# A grammar is JavaScript, evaluated by the Node every other step's JavaScript runs under. Its parser is written just before it is compiled into the checkout, a file the steps that parse with it load by its path: tree-sitter keeps parsers by the grammar's name in a cache every checkout of the machine shares, and hands one back in place of compiling sources older than it, so a parser read through that cache may be another checkout's.
[build.base]
description = "Generate the program's parser into `base/src/`, where the repository commits it, and compile it for the steps that parse with it"
produces.parser = "editors/tree-sitter/base/src"
produces.library = "editors/tree-sitter/.artifacts/curios.so"
run = [
    [
        "{.tools.tree-sitter}", "generate", "editors/tree-sitter/base/grammar.js",
        "--output", "{.tree-sitter.build.base.produces.parser}", "--js-runtime", "{.tools.node}",
    ],
    ["{.tools.tree-sitter}", "build", "editors/tree-sitter/base", "--output", "{.tree-sitter.build.base.produces.library}"],
]

[build.core]
description = "Generate Curios/Core's parser into `core/src/`, where the repository commits it, and compile it for the steps that parse with it"
produces.parser = "editors/tree-sitter/core/src"
produces.library = "editors/tree-sitter/.artifacts/curios_core.so"
run = [
    [
        "{.tools.tree-sitter}", "generate", "editors/tree-sitter/core/grammar.js",
        "--output", "{.tree-sitter.build.core.produces.parser}", "--js-runtime", "{.tools.node}",
    ],
    ["{.tools.tree-sitter}", "build", "editors/tree-sitter/core", "--output", "{.tree-sitter.build.core.produces.library}"],
]

[test]
description = "Hold each grammar to its corpus of trees, and the tree's sources and Zed's queries to the grammars"

# A grammar's corpus of trees is read where the test stands.
[test.base]
description = "Hold the program's grammar to its corpus of trees"
dir = "editors/tree-sitter/base"
consumes = [".tree-sitter.build.base.produces.library"]
run = [
    ["{.tools.tree-sitter}", "test", "--lib-path", "{.tree-sitter.build.base.produces.library}", "--lang-name", "curios"],
]

[test.core]
description = "Hold Curios/Core's grammar to its corpus of trees"
dir = "editors/tree-sitter/core"
consumes = [".tree-sitter.build.core.produces.library"]
run = [
    ["{.tools.tree-sitter}", "test", "--lib-path", "{.tree-sitter.build.core.produces.library}", "--lang-name", "curios_core"],
]

[test.sources]
description = "Parse the standard library, the corpus and the board's Curios/Core without an error, and compile each Zed highlight query against its grammar, so a renamed node cannot orphan a capture silently"
consumes = [".tree-sitter.build.base.produces.library", ".tree-sitter.build.core.produces.library"]
run = [
    [
        "{.tools.tree-sitter}", "parse", "-q", "--lib-path", "{.tree-sitter.build.base.produces.library}", "--lang-name", "curios",
        "{.tree-sitter.variables.programs}",
    ],
    [
        "{.tools.tree-sitter}", "parse", "-q", "--lib-path", "{.tree-sitter.build.core.produces.library}", "--lang-name", "curios_core",
        "{.tree-sitter.variables.core}",
    ],
    [
        "{.tools.tree-sitter}", "query", "-q", "--lib-path", "{.tree-sitter.build.base.produces.library}", "--lang-name", "curios",
        "editors/zed/languages/curios/highlights.scm", "{.tree-sitter.variables.programs}",
    ],
    [
        "{.tools.tree-sitter}", "query", "-q", "--lib-path", "{.tree-sitter.build.core.produces.library}", "--lang-name", "curios_core",
        "editors/zed/languages/curios_core/highlights.scm", "{.tree-sitter.variables.core}",
    ],
]
