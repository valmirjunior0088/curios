description = "The tree-sitter grammars"

[install]
description = "Install the grammar's tools from its lock file, exactly, as every run that reads them does"
dir = "editors/tree-sitter"
produces.installed = "editors/tree-sitter/node_modules"
run = [
    ["{.tools.npm}", "clean-install"],
]

[lint.biome-format]
description = "Fail on formatting drift in the grammar's JavaScript and JSON"
run = [
    ["{.tools.biome}", "format", "editors/tree-sitter"],
]

[lint.biome-lint]
description = "Lint the grammar's JavaScript and JSON"
run = [
    ["{.tools.biome}", "lint", "--error-on-warnings", "editors/tree-sitter"],
]

[build]
description = "Generate the parsers from the grammars, the program's into `base/src/` and Core text's into `core/src/`, where the repository commits them"
dir = "editors/tree-sitter"
consumes = [".tree-sitter.install.produces.installed"]
produces.parser = "editors/tree-sitter/base/src"
run = [
    ["{.tools.npm}", "run", "generate"],
]

[test]
description = "Regenerate the parsers, then parse the standard library, the corpus and the board's Core text"
dir = "editors/tree-sitter"
consumes = [".tree-sitter.install.produces.installed"]
run = [
    ["{.tools.npm}", "test"],
]
