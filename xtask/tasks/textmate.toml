description = "The TextMate grammars, with the table of classes their scopes stand for"

[install]
description = "Install the TextMate grammars' tools from their lock file, exactly, as every run that reads them does"
dir = "editors/textmate"
produces.installed = "editors/textmate/node_modules"
run = [
    ["{.tools.npm}", "clean-install"],
]

[test]
description = "Hold the TextMate grammars to their snapshots"
dir = "editors/textmate"
consumes = [".textmate.install.produces.installed"]
run = [
    ["{.tools.npm}", "test"],
]
