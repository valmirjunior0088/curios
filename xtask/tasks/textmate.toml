what = "The TextMate grammars, with the table of classes their scopes stand for"

[install]
what = "Install the TextMate grammars' tools from their lock file, exactly, as every run that reads them does"
produces.installed = "editors/textmate/node_modules"
run = [
    { in = "editors/textmate", do = ["{.tools.npm}", "clean-install"] },
]

[test]
what = "Hold the TextMate grammars to their snapshots"
consumes = [".textmate.install.produces.installed"]
run = [
    { in = "editors/textmate", do = ["{.tools.npm}", "test"] },
]
