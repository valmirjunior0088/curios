what = "Every tree's formatting, written; the trees' lints hold it"

[rust]
what = "Format the workspace's Rust, the corpus's Rust twins included"
run = [
    ["cargo", "fmt", "--all"],
    ["rustfmt", "--edition", "{.compiler.edition}", "{.compiler.loose}"],
]

[curios]
what = "Format the tree's Curios sources with this tree's compiler, each as the package that governs it states"
consumes = [".compiler.launcher.produces.binary"]
run = [
    ["cargo", "run", "--quiet", "--package", "curios", "--", "format", "{.compiler.sources}"],
]

[markdown]
what = "Format every tracked Markdown file's shape, as `.rumdl.toml` keeps the rules `docs lint` holds"
run = [
    ["{.tools.rumdl}", "fmt", "{.docs.markdown}"],
]

[biome]
what = "Format the JavaScript, JSON and CSS of every tree, as `biome.json` lists them"
run = [
    ["{.tools.biome}", "format", "--write", "."],
]

[zed]
what = "Format the Zed extension, a workspace of its own"
run = [
    { in = "editors/zed", do = ["cargo", "fmt", "--all"] },
]
