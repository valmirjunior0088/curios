description = "Every tree's formatting, written; the trees' lints hold it"

[rust]
description = "Format the workspace's Rust, the corpus's Rust twins included"
run = [
    ["cargo", "fmt", "--all"],
    ["rustfmt", "--edition", "{workspace.edition}", "{workspace.loose}"],
]

[web]
description = "Format the JavaScript, JSON and CSS of every tree, as `biome.json` lists them"
run = [["biome", "format", "--write", "."]]

[zed]
description = "Format the Zed extension, a workspace of its own"
dir = "editors/zed"
run = [["cargo", "fmt", "--all"]]
