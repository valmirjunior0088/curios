description = "Every tree's formatting, written; the trees' lints hold it"

[rust]
description = "Format the workspace's Rust, the corpus's Rust twins included"
run = [
    ["cargo", "fmt", "--all"],
    ["rustfmt", "--edition", "{.workspace.variables.edition}", "{.workspace.variables.loose}"],
]

[curios]
description = "Format the tree's Curios sources with this tree's compiler, each as the package that governs it states"
consumes = [".launcher.build.produces.binary"]
run = [
    ["cargo", "run", "--quiet", "--package", "curios", "--", "format", "{.workspace.variables.sources}"],
]

[biome]
description = "Format the JavaScript, JSON and CSS of every tree, as `biome.json` lists them"
run = [
    ["{.tools.biome}", "format", "--write", "."],
]

[zed]
description = "Format the Zed extension, a workspace of its own"
dir = "editors/zed"
run = [
    ["cargo", "fmt", "--all"],
]
