what = "The VS Code extension"

[install]
what = "Install the VS Code extension's tools from its lock file, exactly, as every run that reads them does"
produces.installed = "editors/vscode/node_modules"
run = [
    { in = "editors/vscode", do = ["{.tools.npm}", "clean-install"] },
]

[build]
what = "Bundle the VS Code extension and the TextMate grammars it ships, and write its package as it ships, which the snapshots never load"
consumes = [".vscode.install.produces.installed"]
run = [
    { in = "editors/vscode", do = ["{.tools.npm}", "run", "package"] },
]
