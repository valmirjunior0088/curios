description = "The VS Code extension"

[install]
description = "Install the VS Code extension's tools from its lock file, exactly, as every run that reads them does"
dir = "editors/vscode"
produces.installed = "editors/vscode/node_modules"
run = [
    ["npm", "clean-install"],
]

[lint.biome-format]
description = "Fail on formatting drift in the VS Code extension's JavaScript and JSON"
run = [
    ["biome", "format", "editors/vscode"],
]

[lint.biome-lint]
description = "Lint the VS Code extension's JavaScript and JSON"
run = [
    ["biome", "lint", "--error-on-warnings", "editors/vscode"],
]

[build]
description = "Bundle the VS Code extension and the TextMate grammars it ships, and write its package as it ships, which the snapshots never load"
dir = "editors/vscode"
consumes = [".vscode.install.produces.installed"]
run = [
    ["npm", "run", "package"],
]
