description = "The VS Code extension"

[install]
description = "Install the VS Code extension's tools from its lock file, exactly, as every run that reads them does"
dir = "editors/vscode"
produces = { installed = "editors/vscode/node_modules" }
run = [["npm", "clean-install"]]

[lint.biome-format]
description = "Fail on formatting drift in the VS Code extension's JavaScript and JSON"
run = [["biome", "format", "editors/vscode"]]

[lint.biome-lint]
description = "Lint the VS Code extension's JavaScript and JSON"
run = [["biome", "lint", "--error-on-warnings", "editors/vscode"]]

[test]
description = "Hold the TextMate grammars to their snapshots"
dir = "editors/vscode"
consumes = ["installed"]
run = [["npm", "test"]]

[build]
description = "Bundle the VS Code extension and write its package as it ships, which the snapshots never load"
dir = "editors/vscode"
consumes = ["installed"]
run = [["npm", "run", "package"]]
