# Perfetto's own reader on the command line, at the release whose schema `curios-profile` generates its messages from, which a test holds it to. A bare binary a platform, whose digests Perfetto's launcher, `tools/trace_processor`, carries from the next release's tag on.
[tools.trace_processor_shell]
version = "58.2"
url.x86_64-unknown-linux-gnu = "https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v{.tools.trace_processor_shell.version}/linux-amd64/trace_processor_shell"
url.aarch64-unknown-linux-gnu = "https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v{.tools.trace_processor_shell.version}/linux-arm64/trace_processor_shell"
url.aarch64-apple-darwin = "https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v{.tools.trace_processor_shell.version}/mac-arm64/trace_processor_shell"
sha256.x86_64-unknown-linux-gnu = "58042408e6cc861fb1a731c26bb082dc222285561eaa4e12a48a8b2b90dca7b9"
sha256.aarch64-unknown-linux-gnu = "0e6e0c5452c505c8d46fe472fd196a0d17d963460727e2ce2013b02aa1309555"
sha256.aarch64-apple-darwin = "d29864d1ba3b36855527bb1b0ca3aa7f703cdce338b9680bb922c5c151b358fa"

[handoff]
description = "Run every check the handoff holds work to: each subject's steps, each after what it requires and consumes"
requires = [
    ".launcher", ".workspace", ".docs", ".compiler", ".bundle",
    ".tree-sitter", ".textmate", ".vscode", ".zed", ".jig",
]

[clean]
description = "Remove the build products git ignores, keeping untracked work, the worktrees under .claude/worktrees and the hunts' snapshots under .claude/snapshots"
# `-X` removes what the ignore rules mark as a build product and nothing else: an untracked file is work no commit holds yet. A worktree under `.claude/worktrees` is ignored, and a nested checkout `-ff` would delete with whatever another session has not committed in it, so the negated pattern un-ignores it, which leaves it to `-X`. A snapshot under `.claude/snapshots` is ignored too, and a hunt running over it would lose its tree, its binaries and what its hunters wrote, so it is kept the same way.
run = [
    ["git", "clean", "-Xffd", "--exclude", "!/.claude/worktrees", "--exclude", "!/.claude/snapshots"],
]
