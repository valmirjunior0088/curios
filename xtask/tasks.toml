url.aarch64-apple-darwin = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/{.tools.wasm-bindgen.version}/wasm-bindgen-{.tools.wasm-bindgen.version}-aarch64-apple-darwin.tar.gz"
