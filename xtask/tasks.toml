description = "The repository's tasks: a group of steps for each file under `tasks/`, and the steps here"

# The programs the steps launch beside the Rust toolchain, which `rust-toolchain.toml` pins, each at the version a run needs, held the first time a step launches it. The workflows read these pins to install each program on their runners.
programs.nextest = "0.9.151"
programs.biome = "2.6.2"
# A minimum, since a contributor's system provides Node.
programs.node = ">= 22"
programs.npm = "11.17.0"
# The generator must match the `wasm-bindgen` crate `Cargo.lock` gives the bundle, which a test holds this to.
programs.wasm-bindgen = "0.2.129"

[handoff]
description = "Run every check the handoff holds work to: each subject's steps, each after what it requires and consumes"
requires = ["launcher", "workspace", "docs", "compiler", "bundle", "tree-sitter", "textmate", "vscode", "zed", "tools"]

[clean]
description = "Remove the build products git ignores, keeping untracked work, the worktrees under .claude/worktrees and the hunts' snapshots under .claude/snapshots"
# `-X` removes what the ignore rules mark as a build product and nothing else: an untracked file is work no commit holds yet. A worktree under `.claude/worktrees` is ignored, and a nested checkout `-ff` would delete with whatever another session has not committed in it, so the negated pattern un-ignores it, which leaves it to `-X`. A snapshot under `.claude/snapshots` is ignored too, and a hunt running over it would lose its tree, its binaries and what its hunters wrote, so it is kept the same way.
run = [
    ["git", "clean", "-Xffd", "--exclude", "!/.claude/worktrees", "--exclude", "!/.claude/snapshots"],
]
