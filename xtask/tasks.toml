description = "The repository's tasks: a group of steps for each file under `tasks/`, and the steps here"

# The programs the steps launch beside the Rust toolchain, which `rust-toolchain.toml` pins: the version a run needs, held the first time a step launches each, and what installs it. The workflows read these pins to install each program on their runners.
[programs.nextest]
version = "0.9.151"
install = "cargo install cargo-nextest --locked --version {version}"

[programs.biome]
version = "2.6.2"
install = "npm install --global @biomejs/biome@{version}"

[programs.node]
# A minimum, since the system installs Node, by no command these files can state.
version = ">= 22"

[programs.npm]
version = "11.17.0"
install = "npm install --global npm@{version}"

[programs.wasm-bindgen]
# The generator must match the `wasm-bindgen` crate `Cargo.lock` gives the bundle, which a test holds this to.
version = "0.2.129"
install = "cargo install wasm-bindgen-cli --locked --version {version}"

[gate]
description = "Run every check the hand-off runs: each subject's steps, each after what it requires and consumes"
requires = ["launcher", "workspace", "instrumented", "docs", "compiler", "bundle", "grammar", "vscode", "zed", "tools"]

[clean]
description = "Remove the build products git ignores, keeping untracked work and the worktrees under .claude/worktrees"
# `-X` removes what the ignore rules mark as a build product and nothing else: an untracked file is work no commit holds yet. A worktree under `.claude/worktrees` is ignored, and a nested checkout `-ff` would delete with whatever another session has not committed in it, so the negated pattern un-ignores it, which leaves it to `-X`.
run = [
    ["git", "clean", "-Xffd", "--exclude", "!/.claude/worktrees"],
]
