what = "The repository's tasks: a group of steps for each file under `tasks/`, and the steps here"

# The script the release is, and the manifests it moves: the workspace's, whose version every crate inherits, and the standard library's, whose compiler follows it.
scripts.release = "xtask/tasks/release.sh"
manifests = ["Cargo.toml", "curios-prelude-build/std/curios.toml"]
bump.argument = "BUMP"
bump.help = "The release to cut: `patch`, `minor` or `major`, or the version itself"
version.argument = "VERSION"
version.help = "The version the release's tag names after `release/`"
# Where a release is published, as the workspace's manifest states it.
repository.read = "Cargo.toml"
repository.key = "workspace.package.repository"

