url.x86_64-unknown-linux-gnu = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/{.tools.wasm-bindgen.version}/wasm-bindgen-{.tools.wasm-bindgen.version}-x86_64-unknown-linux-musl.tar.gz"
