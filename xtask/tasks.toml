# The npm the Node above ships, which installs each npm tree from its lock file.
[tools.npm]
archive = ".tools.node"
path = "bin/npm"

# The bindings generator, at the version `Cargo.lock` gives the `wasm-bindgen` crate, which a test holds it to: it refuses a module built against another version.
[tools.wasm-bindgen]
