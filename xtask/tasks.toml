sha256.aarch64-unknown-linux-gnu = "a9ee2d53cf0711d879f068c0ff814b6fe3af3f9be8799f8ab484e47571087160"
sha256.aarch64-apple-darwin = "d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd"

