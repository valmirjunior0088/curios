[handoff]
what = "Run every check the handoff holds work to: each subject's steps, each after what it requires and consumes"
requires = [
    ".compiler", ".docs", ".distribution", ".bundle", ".conformance", ".biome",
    ".tree-sitter", ".textmate", ".vscode", ".zed", ".jig",
]

# Cutting a release publishes it, so no requirement reaches this step: it runs where it is asked for by its path alone.
[release]
what = "Cut a release: the workspace's version and the standard library's compiler moved to the one the argument names, the lock updated, then one commit, one tag and the push that publishes them"
run = [
    ["sh", "{.scripts.release}", "{.bump}", "{.manifests}"],
]

# The version is baked in when the script is rendered rather than discovered when it runs, so the script a release ships installs that release's binary and a pinned URL stays pinned; what ships is a build product, never a mutated checkout.
[installer]
what = "Render the install script a release attaches, its version baked in, under .artifacts/install.sh beside the release's other assets"
produces.script = ".artifacts/install.sh"
run = [
    { write = "{.installer.produces.script}", template = "xtask/tasks/install.sh" },
]

[clean]
what = "Remove the build products git ignores, keeping untracked work, the worktrees under .claude/worktrees and the hunts' snapshots under .claude/snapshots"
# `-X` removes what the ignore rules mark as a build product and nothing else: an untracked file is work no commit holds yet. A worktree under `.claude/worktrees` is ignored, and a nested checkout `-ff` would delete with whatever another session has not committed in it, so the negated pattern un-ignores it, which leaves it to `-X`. A snapshot under `.claude/snapshots` is ignored too, and a hunt running over it would lose its tree, its binaries and what its hunters wrote, so it is kept the same way.
run = [
    ["git", "clean", "-Xffd", "--exclude", "!/.claude/worktrees", "--exclude", "!/.claude/snapshots"],
]
