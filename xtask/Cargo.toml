[package]
name = "xtask"
description = "The workspace's build recipes as a cargo subcommand: the isolated runtime launcher, the compiler, the gate's every check, the browser bundle, the documentation, the editor trees, the installer script a release attaches, a profile run, and the benchmarks"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own root, not a member of the compiler's workspace: a member's dependencies would unify their features into every `--workspace` build of the compiler, and every `cargo xtask` would take the compiler's target directory's lock before running anything. Nothing in the compiler depends on it, and it depends on nothing of the compiler.
[workspace]

# The compiler's workspace's lint table, restated because a workspace of its own cannot inherit one; `the_lint_table_is_the_workspace_s` holds the two equal.
[lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
iter_over_hash_type = "warn"
unused_self = "warn"

[lints.rustdoc]
all = "deny"

[dependencies]
# Generates the glue for `curios-js`'s `wasm-bindgen`, so the two move together: `the_bindings_generator_is_the_bindings_version` holds them equal.
wasm-bindgen-cli-support = { version = "0.2.126" }
clap = { version = "4.6.1", features = ["derive"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# For `release` alone: format-preserving edits of the workspace and standard-library manifests, so a bump sets only their version fields and the diff it produced can be read back and checked exactly. One crate's dependency rather than the workspace table's, the arrangement `curios-native` uses for wasmtime and `curios-js` for js-sys.
toml_edit = { version = "0.25.15" }

# Optimized, as the compiler's workspace builds: `bundle build` runs the bindings generator in this process over the browser bundle's module, which an unoptimized build makes the slowest part of the step.
[profile.dev]
opt-level = 3
