[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The runner of the repository's task files as a cargo subcommand: every build, check and test step the task files state, the installer script a release attaches, and the release itself"
publish = false

[lints]
workspace = true

[dependencies]
# The digest a pinned download is held to.
sha2 = { workspace = true }
# This crate alone takes anything from the network, so it is the one crate that names the HTTP client, and states its version here (`documentation/design/one-crate-is-the-authority-for-one-external-concern.md`).
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# A pinned archive unpacked, gzipped tarballs and gzipped files alike, the one place either is named.
tar = "0.4.46"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# `string` for a command line whose subcommands and flags are the task files' names, read when the program runs.
clap = { workspace = true, features = ["string"] }
askama = { workspace = true }
# The task files, read with the place of every key and value for a refusal's caret, and for `release`, format-preserving edits of the workspace and standard-library manifests, so a bump sets only their version fields and the diff it produced can be read back and checked exactly.
toml_edit = { workspace = true }

[dev-dependencies]
# `fill!`, by which a fixture splices a value into task files whose own braces stay single.
curios-common = { workspace = true, features = ["test-support"] }
