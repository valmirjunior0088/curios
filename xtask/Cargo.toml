[package]
name = "xtask"
description = "The workspace's build recipes as a cargo subcommand: the isolated runtime launcher, the compiler, the gate's every check, the browser bundle, the documentation, the editor trees, the installer script a release attaches, a profile run, and the benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wasm-bindgen-cli-support = { workspace = true }
clap = { workspace = true }
askama = { workspace = true }
# For the fold alone: `profile` runs a profiling build and summarizes the stream it filed, which is the half a recipe can do and the compiler should not. `enabled` carries the reader, not the instrumentation — nothing here is measured.
curios-profile = { workspace = true, features = ["enabled"] }
