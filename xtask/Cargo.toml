[package]
name = "xtask"
description = "The runner of the repository's task files as a cargo subcommand: every build, check and test step the task files state, the installer script a release attaches, and the release itself"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
# `string` for a command line whose subcommands and flags are the task files' names, read when the program runs.
clap = { workspace = true, features = ["string"] }
askama = { workspace = true }
# The task files, read with the place of every key and value for a refusal's caret, and for `release`, format-preserving edits of the workspace and standard-library manifests, so a bump sets only their version fields and the diff it produced can be read back and checked exactly.
toml_edit = { workspace = true }
