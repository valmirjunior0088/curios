[package]
name = "xtask"
description = "The workspace's build recipes as a cargo subcommand: the isolated runtime launcher, the compiler, the gate's every check, the browser bundle, the documentation, the editor trees, the installer script a release attaches, a profile run, and the benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wasm-bindgen-cli-support = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# For `release` alone: a format-preserving edit of the root manifest, so a bump sets the one line it names and the diff it produced can be read back and checked exactly. One crate's dependency rather than the workspace table's, the arrangement `curios-runtime` uses for wasmtime and `curios-js` for js-sys.
toml_edit = { version = "0.25.15" }
