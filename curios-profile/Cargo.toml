[package]
name = "curios-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Programmatic profiling for the Curios workspace: span macros, the subscriber that streams one row per span and event, and the fold that reads a stream back"

[lints]
workspace = true

[features]
enabled = ["dep:tracing"]

# The one place in the workspace `tracing` is named, so the pin lives here
# rather than in the workspace table. No `attributes` feature: the workspace
# instruments through `profile!`, never the proc macro.
[dependencies]
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-utilities = { workspace = true, features = ["test-support"] }
