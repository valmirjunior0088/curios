[package]
name = "curios-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Programmatic profiling for the Curios workspace: the subscriber that streams one row per span and event of what curios-common's macros instrument, and the fold that reads a stream back"

[lints]
workspace = true

[dependencies]
# The subscriber's side of `tracing`, which `curios-common`'s macros write to.
tracing = { workspace = true }

# The one place in the workspace `libc` is named, for the one system call the instruction count makes, `perf_event_open`, which only Linux has.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.186", default-features = false }

[dev-dependencies]
# The directory of its own every suite here works in, canonical and removed however the test ends, and the macros whose reading the recorder holds.
curios-common = { workspace = true, features = ["test-support"] }
