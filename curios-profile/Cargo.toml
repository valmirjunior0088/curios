[package]
name = "curios-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Programmatic profiling for the Curios workspace: the subscriber that writes what curios-tracing's macros instrument as Perfetto's trace, and the fold that reads a trace back"

[lints]
workspace = true

[dependencies]
# The report a profile's answer is drawn as, the block every answer of the command line is.
curios-common = { workspace = true }
# `tracing`'s subscriber interface, through its one door, which the recorder implements for what the macros write.
curios-tracing = { workspace = true }
# The codec of the messages the build script generates from Perfetto's schema; this crate alone takes it, so its pin is here.
prost = { version = "0.14.6" }

# Perfetto's schema fetched and checked as every pinned file is, parsed without a `protoc`, and the messages the recorder uses generated from it.
[build-dependencies]
prost-build = { version = "0.14.6" }
prost-types = { version = "0.14.6" }
protox = { version = "0.9.1" }

[dev-dependencies]
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
