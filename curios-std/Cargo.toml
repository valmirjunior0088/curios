[package]
name = "curios-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios standard library: the /std package as it is authored, and where the compiler finds it"

[lints]
workspace = true

[dependencies]
curios-utilities = { workspace = true }
curios-text = { workspace = true }
curios-package = { workspace = true }

# The library's claims compile through the whole pipeline and run under the mock host, so its suite depends on the compiler the library is a part of. Cargo admits the cycle because it runs through a dev-dependency, and `curios-prelude-archive`'s build script, which reads the normal dependencies alone, never sees it.
[dev-dependencies]
curios = { workspace = true }
curios-pipeline = { workspace = true }
curios-native = { workspace = true }
# The scratch store the claims file what they compiled into.
curios-verdicts = { workspace = true }
# The conformance cases `/std/Str/graphemes` is held to, and the lookups `/std/Char`'s answers are compared with.
curios-unicode = { workspace = true, features = ["test-support"] }
# `fill!`, for the program the conformance cases are written into.
curios-utilities = { workspace = true, features = ["test-support"] }
