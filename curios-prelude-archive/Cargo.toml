[package]
name = "curios-prelude-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The build-scoped images of Curios's fixed /sys and /std prelude: the elaboration of the /sys root curios-text generates and the /std package curios-std holds, and one archived unit each"
build = "build.rs"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-text/profile",
    "curios-elab/profile",
    "curios-ersd/profile",
    "curios-unit/profile",
    "dep:curios-std",
]

# The program that is asked for the elaboration's profile: the build script's work under a recorder, to a path it is handed. It stands beside `build.rs` so the two share `elaborate.rs` as a module.
[[bin]]
name = "profile-elaboration"
path = "profile.rs"
required-features = ["profile"]

[dependencies]
curios-profile = { workspace = true }
curios-document = { workspace = true, features = ["archive"] }
curios-utilities = { workspace = true, features = ["archive"] }
curios-core = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-unit = { workspace = true, features = ["archive"] }
curios-archive = { workspace = true, features = ["enabled"] }
# For `profile-elaboration` alone, which reads the library's sources as the build script does.
curios-std = { workspace = true, optional = true }

# Deliberately absent: `curios-cert`. Elaborating the prelude does not depend on
# the kernel, and Cargo's rebuild granularity is the build script — so a crate
# whose script needs both would re-elaborate the whole standard library for
# every certifier edit. Certification lives in `curios-prelude`'s script, which
# is what buys that separation. See
# this crate's README, "Why this is not `curios-prelude`".
[build-dependencies]
curios-abi = { workspace = true, features = ["archive"] }
curios-document = { workspace = true, features = ["archive"] }
curios-utilities = { workspace = true, features = ["archive"] }
curios-core = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-std = { workspace = true }
curios-package = { workspace = true }
curios-unit = { workspace = true, features = ["archive"] }
curios-archive = { workspace = true, features = ["enabled"] }

[dev-dependencies]
curios-abi = { workspace = true, features = ["archive"] }
curios-cert = { workspace = true, features = ["archive"] }
curios-std = { workspace = true }
