[package]
name = "curios-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios browser boundary: wasm-bindgen compiler exports and the JavaScript run harness"

[lints]
workspace = true

[features]
profile = ["curios-pipeline/profile"]

# cdylib for the wasm-bindgen build; rlib so `cargo test -p curios-js` still has something to link against.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
curios-abi = { workspace = true }
curios-text = { workspace = true }
curios-pipeline = { workspace = true }
curios-wasm = { workspace = true }
curios-emit = { workspace = true }
# Moves with `xtask`'s `wasm-bindgen-cli-support`, which generates the glue for it: `xtask`'s `the_bindings_generator_is_the_bindings_version` holds the two equal across the two workspaces.
wasm-bindgen = { version = "0.2.126" }
js-sys = { version = "0.3.103" }

[dev-dependencies]
curios-native = { workspace = true, features = ["test-support"] }
# What compiles the bridge module the suite drives by hand.
curios-cranelift = { workspace = true }
# `fill!`, by which a fixture splices a value into text whose own braces stay single.
curios-utilities = { workspace = true, features = ["test-support"] }
