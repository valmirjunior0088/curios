[package]
name = "curios-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios compiler in the browser: the wasm-bindgen export of the pure compile pipeline, bundled with the run of what it compiles"

[lints]
workspace = true

[features]
profile = ["curios-pipeline/profile"]

# cdylib for the wasm-bindgen build; rlib so `cargo test -p curios-js` still has something to link against.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
curios-browser = { workspace = true }
curios-text = { workspace = true }
curios-pipeline = { workspace = true }
curios-wasm = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
