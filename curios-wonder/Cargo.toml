[package]
name = "curios-wonder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the compiler knows about a program, handed out as records: the wonder engine, the command-line and language-server transports, and the lint gate"

[lints]
workspace = true

[features]
# `test_support`: a library's documentation record made the way a question compiles, and the names a subject and its records are read by, which `curios`'s suites read. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness. **Never add this to `default`.**
test-support = []

# Under `curios` and free of everything it links: no Binaryen, no Wasmtime, no launcher. A question
# runs the compiler as far as it needs and reads the answer off the cabinet through `curios-verdict`.
# The language server's protocol crates have this crate as their one owner.
[dependencies]
curios-common = { workspace = true }
curios-tracing = { workspace = true }
curios-document = { workspace = true }
# For what a name is declared as and where its declaration's name is written, which `--at` and `--name` answer in the lowering's own terms.
curios-core = { workspace = true }
curios-module = { workspace = true }
curios-surface = { workspace = true }
curios-unit = { workspace = true }
# For what `--footprint` reads of each rung a program's compilation passes: the functions of a lineage in the erased program, what the CPS graph holds of one (`curios-cps`'s survey, since the graph is its to walk), the Wasm functions the emitter names after each and what the writer measures of each body. No back end past the emitted module — `curios-pipeline` already depends on each to name the module of its `Stage`.
curios-anf = { workspace = true }
curios-cps = { workspace = true }
curios-emit = { workspace = true }
curios-wasm = { workspace = true }
# For what elaboration concluded of each declaration a place stands in: the type each place settled at and each binder's (`Traces`, `Concluded`).
curios-elab = { workspace = true }
curios-pipeline = { workspace = true }
# For the prefixes the prelude's roots claim, read off their names with none restored: a name resolved under one is painted as the library the compiler was built with (`defaultLibrary`).
curios-prelude = { workspace = true }
curios-package = { workspace = true }
curios-verdict = { workspace = true }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = { workspace = true }

[dev-dependencies]
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
# The directory a cabinet files its objects in, which the cabinet's suite lists, removes and blocks.
curios-package = { workspace = true, features = ["test-support"] }
