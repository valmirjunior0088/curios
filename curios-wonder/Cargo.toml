[package]
name = "curios-wonder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the compiler knows about a program, handed out as records: the wonder engine, the command-line and language-server transports, and the lint gate"

[lints]
workspace = true

[features]
# `test_support`: a library's documentation record made the way a question compiles, and the names a subject and its records are read by, which `curios`'s suites read. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness. **Never add this to `default`.**
test-support = []

# Under `curios` and free of everything it links: no Binaryen, no Wasmtime, no launcher. A question
# runs the compiler as far as it needs and reads the answer off the store through `curios-verdict`;
# the one rung the driver cannot render, `wasm-optm`, is handed back for the product that owns
# Binaryen to finish. The language server's protocol crates have this crate as their one owner.
[dependencies]
curios-common = { workspace = true }
curios-document = { workspace = true }
# For what a name is declared as and where its declaration's name is written, which `at` and `declarations` answer in the lowering's own terms.
curios-core = { workspace = true }
curios-module = { workspace = true }
curios-surface = { workspace = true }
curios-unit = { workspace = true }
curios-wasm = { workspace = true }
# For the fate survey `cost` reads: the CPS graph is `curios-cps`'s to walk, so the walk lives there and this crate is one of its consumers. It carries no back end — `curios-pipeline` already depends on it to name `curios_cps::Module` in `Stage`.
curios-cps = { workspace = true }
curios-pipeline = { workspace = true }
curios-package = { workspace = true }
curios-verdict = { workspace = true }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = { workspace = true }

[dev-dependencies]
# The directory of its own every suite here works in, canonical and removed however the test ends.
curios-common = { workspace = true, features = ["test-support"] }
