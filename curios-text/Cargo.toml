[package]
name = "curios-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios surface syntax: lexer, parser, printer, module resolution, and lowering to core"

[lints]
workspace = true

[features]
archive = ["dep:rkyv", "curios-abi/archive", "curios-base/archive", "curios-elab/archive"]
profile = ["curios-profile/enabled"]

[dependencies]
curios-profile = { workspace = true }
curios-abi = { workspace = true }
curios-base = { workspace = true }
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rkyv = { workspace = true, optional = true }
