[package]
name = "curios-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The curios surface syntax: lexer/parser and lowering to core"

[lints]
workspace = true

[features]
archive = ["dep:rkyv", "curios-abi/archive", "curios-base/archive", "curios-core/archive"]
profile = ["dep:tracing"]

[dependencies]
curios-abi = { workspace = true }
curios-base = { workspace = true }
curios-core = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rkyv = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
