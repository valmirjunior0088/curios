{#- The runner a test serve answers at its root: what the run hands it as one JSON block — the key a page spells its arguments under — the runner's script whole, the element the command's lines are shown in and the one each test's iframe stands in, visible, since a gateway may draw. -#}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ title }}</title>
        <script type="application/json" id="run">{{ run|safe }}</script>
        <script type="module">{{ runner|safe }}</script>
    </head>
    <body>
        <pre id="lines"></pre>
        <div id="frame"></div>
    </body>
</html>
