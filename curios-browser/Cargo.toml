[package]
name = "curios-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios browser host: the harness that runs a compiled program in a JavaScript engine, the bridge it reads the program's values through, what it is configured with, and the page a browser build writes"

[lints]
workspace = true

[dependencies]
curios-abi = { workspace = true }
curios-wasm = { workspace = true }
curios-emit = { workspace = true }
# The SHA-256 a page states each file's integrity by.
curios-common = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The page's two templates, under `templates/`.
askama = { workspace = true }
# What carries a digest in an integrity and the bridge's bytes in the loader.
base64 = "0.23.1"

[dev-dependencies]
curios-native = { workspace = true, features = ["test-support"] }
# What compiles the bridge module the suite drives by hand.
curios-cranelift = { workspace = true }
# `fill!`, by which a fixture splices a value into text whose own braces stay single.
curios-common = { workspace = true, features = ["test-support"] }
