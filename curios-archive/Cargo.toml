[package]
name = "curios-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-copy archiving for the Curios workspace: the one crate that names rkyv"

[lints]
workspace = true

# The one place in the workspace rkyv is named, so the pin and the feature set
# live here rather than in the workspace table. A row in `[workspace.dependencies]`
# shares configuration; it does not concentrate authority, because any crate may
# still add `rkyv = { workspace = true }` without anyone deciding it should.
[dependencies]
curios-archive-derive = { workspace = true }
rkyv = { version = "0.8.16", default-features = false, features = [
    "alloc",
    "bytecheck",
    "little_endian",
    "pointer_width_32",
    "std",
    "unaligned",
] }
