[package]
name = "curios-anf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios/ANF, the erased representation in A-normal form: its optimizer and its lowering to Curios/CPS"

[lints]
workspace = true

[features]
# `test_support`: a module's structural digest, the census's verdict on a field and the weight of a description's copy, for the suites of `curios-elab`, `curios-pipeline` and `curios` that pin what this crate built. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate's tests — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

[dependencies]
curios-archive = { workspace = true }
curios-abi = { workspace = true }
curios-common = { workspace = true }
curios-cps = { workspace = true }
curios-num = { workspace = true }
