[package]
name = "curios-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios certifier: the independent kernel deciding, from a finished term alone, whether the elaborator's output is well-typed"

[lints]
workspace = true

[features]
archive = ["curios-archive/enabled", "curios-base/archive", "curios-core/archive"]
profile = ["curios-profile/enabled", "curios-analysis/profile", "curios-core/profile"]

# Tests only. `curios-abi` is already inside this crate's normal graph through `curios-core` — DESIGN.md's enumeration of the trusted base names it — so this adds nothing to what `cargo tree -p curios-cert -e normal` reaches. It is here so a fixture can forge an ABI row by hand.
[dev-dependencies]
curios-abi = { workspace = true }

[dependencies]
curios-archive = { workspace = true }
curios-profile = { workspace = true }
curios-analysis = { workspace = true }
curios-base = { workspace = true }
curios-core = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
