[package]
name = "curios-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios certifier: the independent kernel deciding, from a finished term alone, whether the elaborator's output is well-typed"

[lints]
workspace = true

[features]
archive = ["curios-archive/enabled", "curios-utilities/archive", "curios-core/archive", "curios-num/archive"]
profile = ["curios-profile/enabled", "curios-analysis/profile", "curios-core/profile"]

# Tests only. `curios-abi` is already inside this crate's normal graph through `curios-core` — `documentation/design/language/an-independent-kernel-re-checks-what-the-elaborator-accepts.md`'s enumeration of the trusted base names it — so this adds nothing to what `cargo tree -p curios-cert -e normal` reaches. It is here so a fixture can forge an ABI row by hand.
[dev-dependencies]
curios-core = { workspace = true, features = ["test-support"] }
curios-abi = { workspace = true }
# The shared `/syn` registry stand-in in `curios_analysis::fixture`, which every kernel this crate's tests build is handed. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-analysis = { workspace = true, features = ["test-support"] }

[dependencies]
curios-archive = { workspace = true }
curios-profile = { workspace = true }
curios-analysis = { workspace = true }
curios-utilities = { workspace = true }
curios-core = { workspace = true }
curios-num = { workspace = true }
