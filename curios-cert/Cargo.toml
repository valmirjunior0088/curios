[package]
name = "curios-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Curios certifier: the independent checker deciding, from a finished term alone, whether the elaborator's output is well-typed"

[lints]
workspace = true

[features]
profile = ["curios-profile/enabled", "curios-analysis/profile", "curios-core/profile"]
# `test_support`: what a reading through the certifier spends, which `curios-erase`'s suite measures, the certifier's errors by name, which the soundness board's records name a refusal by, a certifier and a walk with their memos off, which `curios-analysis`'s and `curios-prelude`'s suites reduce and measure under, and the harness its suites put a candidate through, Core text read by `curios-surface`'s reader, the reader `curios-pipeline`'s door reads the board's tickets and a `.crsc` with. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness. **Never add this to `default`.**
test-support = ["curios-common/test-support", "dep:curios-surface"]

[dev-dependencies]
# The carriers and operations `Intrinsic::algebra` declares an intrinsic at, which a fixture reads against the row that types it. Inside this crate's normal graph through `curios-core`, so this adds nothing to what `cargo tree -p curios-cert -e normal` reaches.
curios-algebra = { workspace = true }
# The shared syntax-registry stand-in in `curios_analysis::fixture`, which every certifier this crate's tests build is handed. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-analysis = { workspace = true, features = ["test-support"] }
# The printer a test renders a refusal through, as a reporter hands the certifier one ([`curios_core::Notation`]). Tests only: the certifier's own graph never reaches a printer.
curios-surface = { workspace = true }
# `fill!`, by which a fixture splices a value into text whose own braces stay single. A dev-dependency entry beside the normal one, because the feature must not reach a build that ships.
curios-common = { workspace = true, features = ["test-support"] }

[dependencies]
# The reader of Core text, behind `test-support` alone: what a suite's candidate is written in, read where `test_support` puts it. The product reads Core text through `curios-pipeline`'s door, above this crate, so the trusted base `cargo tree -p curios-cert --edges normal` enumerates does not reach the reader.
curios-surface = { workspace = true, optional = true }
curios-archive = { workspace = true }
curios-profile = { workspace = true }
curios-analysis = { workspace = true }
curios-common = { workspace = true }
curios-core = { workspace = true }
curios-num = { workspace = true }
