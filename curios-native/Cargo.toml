[package]
name = "curios-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The runtime-only Curios engine: .cwasm deserialization, host bindings, and the slim launcher"

[lints]
workspace = true

# Lib (the engine/host API, reused by curios) + bin (the launcher stub).
# Building `-p curios-native` yields a slim, runtime-only launcher: no feature of this crate reaches a compiler, which is `curios-cranelift`'s to link, so the isolated build `cargo xtask compiler launcher` runs cannot reach one. That property is checked against the shipped bytes by `curios/src/bundle.rs`'s guards, not merely asserted here.

[features]
# `start_test_engine`, for a test that reaches the engine, which starts it as every test does; `GuestInstance`, for a *test* that drives an emitted module by hand — `curios-js`'s bridge suite — `run_answering_raw`, for one that answers a row as no adapter would, and `collected`, for one that counts the engine's collections. The last listens on the `log` facade, the channel wasmtime reports through, which this crate names for it alone. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to another crate's tests; a dev-dependency carries the crate, not its private test code.
test-support = ["dep:log"]

[dependencies]
# `ForeignStore`, which a bundle carries archived: the rows a payload's `ffi` imports are typed by cannot be recovered from the payload.
curios-abi = { workspace = true }
# rkyv itself, for the bundle archive the launcher reads.
curios-archive = { workspace = true }
# The engine without a backend, on the workspace's one row for Wasmtime: `curios-cranelift` takes the same row for the compiler, so the version that precompiles a `.cwasm` and the version this crate deserializes it with cannot drift.
wasmtime = { workspace = true, features = ["runtime", "gc", "gc-copying", "std"] }
log = { version = "0.4.33", optional = true }
getrandom = { version = "0.4.3" }
socket2 = { version = "0.6.4" }
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "stdio", "termios"] }
# The thread that gives back every terminal a program took when a terminating signal arrives, then lets the signal end the process: the one place the native host handles a signal, through the crate's safe registration of a pipe its handler writes rather than a handler of ours.
signal-hook = { version = "0.4.5", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2.2.0" }
webpki-roots = { version = "1.0.8" }

[dev-dependencies]
# The pseudo-terminal a serial open is tested on. A dev-dependency rather than a feature of the row above, so the launcher `cargo xtask compiler launcher` builds never carries it.
rustix = { version = "1.1.4", features = ["pty"] }
# The directory of its own every suite here works in, canonical and removed however the test ends. A dev-dependency for the same reason, so the launcher `cargo xtask compiler launcher` builds never carries it.
curios-common = { workspace = true, features = ["test-support"] }
# This crate on itself, only to turn `test-support` on for its own tests: the engine's suite runs a program under the mock host, which lives in `test_support`. A dev-dependency for the same reason as the rows above.
curios-native = { path = ".", features = ["test-support"] }
