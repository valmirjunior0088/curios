[package]
name = "curios-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Foundational utilities shared across every Curios stage and tool: spans, names, entropy, the typed arena, persistent maps, a file written whole, and the macros a site instruments with"

[lints]
workspace = true

[features]
# `test_support`'s `Temporary`, the directory of its own a test that touches the disk works in, removed when dropped. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness, so a `cfg(test)` item is invisible to every other crate's tests — the same reason `curios-native`'s `test-support` is a feature. **Never add this to `default`.**
test-support = []

# The one SHA-256 authority among the product crates (`documentation/design/one-crate-is-the-authority-for-one-external-concern.md`): every content digest, cabinet key and tree hash is spelled through `digest.rs`.
[dependencies]
curios-archive = { workspace = true }
# The grapheme clusters and East Asian widths a report's caret is placed and sized by.
curios-unicode = { workspace = true }
stacker = { version = "0.1.25" }
sha2 = { workspace = true }
# What `profile!`, `sample!` and `note!` expand to; `curios-profile` names it too, for the subscriber it implements.
tracing = { workspace = true }
