[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The build-scoped archive of Curios's fixed /sys, /syn, and /std prelude"
build = "build.rs"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-text/profile",
    "curios-elab/profile",
    "curios-ersd/profile",
]

[dependencies]
curios-profile = { workspace = true }
curios-abi = { workspace = true, features = ["archive"] }
curios-base = { workspace = true, features = ["archive"] }
curios-core = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
rkyv = { workspace = true }
sha2 = "0.11.0"

# The kernel is a build-dependency because certifying the prelude is what the build script does. It is a dev-dependency as well, and only that, for the two ignored inventories in `src/restore.rs` that read the certifier's verdicts over the restored image rather than asserting them.
[dev-dependencies]
curios-cert = { workspace = true, features = ["archive"] }

[build-dependencies]
# The build script is where the fixed prelude is actually elaborated, so it is
# same dependency in both kinds: the library's measurement points and the build
# script's collector activate together through `curios-profile/enabled`.
# the only place a capture can observe compiler spans for that work — hence the
curios-abi = { workspace = true, features = ["archive"] }
curios-base = { workspace = true, features = ["archive"] }
curios-cert = { workspace = true, features = ["archive"] }
curios-core = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
curios-profile = { workspace = true }
curios-text = { workspace = true, features = ["archive"] }
rkyv = { workspace = true }
sha2 = "0.11.0"
