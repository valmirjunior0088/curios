[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios's fixed prelude: /std as authored, and the build that elaborates, certifies and erases it with /sys into the certified units every compilation starts from"
build = "build.rs"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-text/profile",
    "curios-elab/profile",
    "curios-erase/profile",
    "curios-unit/profile",
    "curios-cert/profile",
    "dep:curios-cert",
    "dep:curios-elab",
    "dep:curios-erase",
]

# The program that is asked for the build's profile: the build script's work under a recorder, to a path it is handed. It stands beside `build.rs` so the two share `compile.rs` as a module.
[[bin]]
name = "profile-prelude"
path = "profile.rs"
required-features = ["profile"]

[dependencies]
curios-archive = { workspace = true }
curios-core = { workspace = true }
curios-document = { workspace = true }
curios-package = { workspace = true }
curios-profile = { workspace = true }
curios-text = { workspace = true }
curios-unit = { workspace = true }
curios-utilities = { workspace = true }
# For `profile-prelude` alone, which makes the prelude as the build script does.
curios-cert = { workspace = true, optional = true }
curios-elab = { workspace = true, optional = true }
curios-erase = { workspace = true, optional = true }

# The prelude's one build: `/sys` and `/std` lowered, elaborated, erased and certified, each root imaged as the certified unit the crate restores.
[build-dependencies]
curios-archive = { workspace = true }
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-document = { workspace = true }
curios-elab = { workspace = true }
curios-erase = { workspace = true }
curios-package = { workspace = true }
curios-text = { workspace = true }
curios-unit = { workspace = true }
curios-utilities = { workspace = true }

# The library's claims compile through the whole pipeline and run under the mock host, so its suite depends on the compiler the library is a part of. Cargo admits the cycle because it runs through a dev-dependency, and the build script, which reads its build-dependencies alone, never sees it.
[dev-dependencies]
curios = { workspace = true }
curios-abi = { workspace = true }
curios-cert = { workspace = true }
curios-elab = { workspace = true }
curios-erase = { workspace = true }
curios-native = { workspace = true }
curios-pipeline = { workspace = true }
# The scratch store the claims file what they compiled into.
curios-verdicts = { workspace = true }
# The conformance cases `/std/Str/graphemes` is held to, and the lookups `/std/Char`'s answers are compared with.
curios-unicode = { workspace = true, features = ["test-support"] }
# `fill!`, for the program the conformance cases are written into.
curios-utilities = { workspace = true, features = ["test-support"] }
