[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The build-scoped archive of Curios's fixed /sys, /syn, and /std prelude"
build = "build.rs"

[lints]
workspace = true

[features]
profile = [
    "curios-profile/enabled",
    "curios-text/profile",
    "curios-elab/profile",
    "curios-ersd/profile",
]

[dependencies]
curios-profile = { workspace = true }
curios-abi = { workspace = true, features = ["archive"] }
curios-base = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
rkyv = { workspace = true }
sha2 = "0.11.0"

[build-dependencies]
curios-abi = { workspace = true, features = ["archive"] }
curios-base = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
rkyv = { workspace = true }
sha2 = "0.11.0"
# The build script is where the fixed prelude is actually elaborated, so it is
# the only place a capture can observe compiler spans for that work — hence the
# same dependency in both kinds: the library's measurement points and the build
# script's collector activate together through `curios-profile/enabled`.
curios-profile = { workspace = true }
