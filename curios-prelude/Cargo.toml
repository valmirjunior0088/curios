[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios's fixed prelude: the certified units of /sys and /std every compilation starts from, made by this crate's build and restored for each compilation"
build = "build.rs"

[lints]
workspace = true

[features]
# `test_support`: the scope a root is certified over and the items the roots hold, which this crate's suites and the bench's measurements of the prelude read. A feature rather than `#[cfg(test)]` because that cfg is set only while this crate is its own test harness. **Never add this to `default`.**
test-support = ["dep:curios-cert", "dep:curios-core"]

[dependencies]
curios-archive = { workspace = true }
curios-common = { workspace = true }
curios-document = { workspace = true }
curios-unit = { workspace = true }
# The certifier's environment and the items a root holds, for the test support alone.
curios-cert = { workspace = true, optional = true }
curios-core = { workspace = true, optional = true }

# The prelude's one build: `/sys` and `/std` lowered, elaborated, certified and erased by `curios-prelude-build`, each root imaged as the certified unit the crate restores. `curios-package` names the manifest beside `/std`, which the script watches.
[build-dependencies]
curios-prelude-build = { workspace = true }
curios-package = { workspace = true }

# The library's claims compile through the whole pipeline and run under the mock host, so its suite depends on the compiler the library is a part of. Cargo admits the cycle because it runs through a dev-dependency, and the build script, which reads its build-dependencies alone, never sees it.
[dev-dependencies]
curios = { workspace = true, features = ["test-support"] }
curios-abi = { workspace = true }
curios-cert = { workspace = true, features = ["test-support"] }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-module = { workspace = true }
curios-native = { workspace = true, features = ["test-support"] }
curios-package = { workspace = true }
curios-pipeline = { workspace = true }
# Where `/std` is authored, its source as a package and `/sys`'s roster, which the suites hold the sources and the archived units to.
curios-prelude-build = { workspace = true }
curios-surface = { workspace = true }
# The scratch cabinet the claims file what they compiled into.
curios-verdict = { workspace = true }
# The diagnostics `curios lint` reports of a package, which the test modules are held lint clean by.
curios-wonder = { workspace = true }
# The conformance cases `/std/Str/graphemes` is held to, and the lookups `/std/Char`'s answers are compared with.
curios-unicode = { workspace = true, features = ["test-support"] }
# `fill!`, for the program the conformance cases are written into.
curios-common = { workspace = true, features = ["test-support"] }
