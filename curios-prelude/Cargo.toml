[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios's fixed prelude, certified by the independent kernel as a condition of this crate building"
build = "build.rs"

[lints]
workspace = true

[features]
profile = [
    "curios-prelude-archive/profile",
    "curios-cert/profile",
    "curios-profile/enabled",
    "dep:curios-cert",
    "dep:curios-elab",
    "dep:curios-profile",
    "dep:curios-text",
]

# The program that is asked for the certification's profile: the build script's work under a recorder, to a path it is handed. It stands beside `build.rs` so the two share `certify.rs` as a module.
[[bin]]
name = "profile-certification"
path = "profile.rs"
required-features = ["profile"]

[dependencies]
curios-prelude-archive = { workspace = true }
# The record the build script files is read back beside the images: its type is
# `curios-core`'s, read through the one crate that names rkyv, and attached to
# `curios-unit`'s unit.
curios-archive = { workspace = true }
curios-core = { workspace = true }
curios-document = { workspace = true }
curios-unit = { workspace = true }
# For `profile-certification` alone, which certifies as the build script does.
curios-cert = { workspace = true, optional = true }
curios-elab = { workspace = true, optional = true }
curios-profile = { workspace = true, optional = true }
curios-text = { workspace = true, optional = true }

# The certifying half of the prelude's build: `curios-prelude-archive`
# elaborates and serializes the image, and this script restores it and runs the
# kernel over it. Why the two are separate crates is this crate's `README.md`.
[build-dependencies]
curios-archive = { workspace = true }
curios-cert = { workspace = true }
curios-core = { workspace = true }
curios-elab = { workspace = true }
curios-prelude-archive = { workspace = true }
curios-text = { workspace = true }
