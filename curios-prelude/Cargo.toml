[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios's fixed prelude, certified by the independent kernel as a condition of this crate building"
build = "build.rs"

[lints]
workspace = true

[features]
profile = ["curios-prelude-archive/profile"]

[dependencies]
curios-prelude-archive = { workspace = true }

# The two halves of what used to be one build script. `curios-prelude-archive`
# elaborates and serializes the image; this script restores it and runs the
# kernel over it. They are separate crates because Cargo re-runs a build script
# whenever *any* of its dependencies change, so a script holding both would
# re-elaborate the whole standard library for every certifier edit.
[build-dependencies]
curios-cert = { workspace = true, features = ["archive"] }
curios-prelude-archive = { workspace = true }
