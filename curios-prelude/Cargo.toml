[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curios's fixed prelude, certified by the independent kernel as a condition of this crate building"
build = "build.rs"

[lints]
workspace = true

[features]
profile = ["curios-prelude-archive/profile", "curios-cert/profile", "curios-profile/enabled"]

[dependencies]
curios-prelude-archive = { workspace = true }
# The record the build script files is read back beside the images: its type is
# `curios-core`'s, read through the one crate that names rkyv, and attached to
# `curios-unit`'s unit.
curios-archive = { workspace = true, features = ["enabled"] }
curios-core = { workspace = true, features = ["archive"] }
curios-unit = { workspace = true }

# The certifying half of the prelude's build: `curios-prelude-archive`
# elaborates and serializes the image, and this script restores it and runs the
# kernel over it. Why the two are separate crates is this crate's `README.md`.
[build-dependencies]
curios-archive = { workspace = true, features = ["enabled"] }
curios-cert = { workspace = true, features = ["archive"] }
curios-core = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-profile = { workspace = true }
curios-prelude-archive = { workspace = true }
curios-text = { workspace = true, features = ["archive"] }
