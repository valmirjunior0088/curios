[package]
name = "curios-prelude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The build-scoped archived Curios sys/syn/std prelude"
build = "build.rs"

[lints]
workspace = true

[features]
profile = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "curios-text/profile",
    "curios-elab/profile",
    "curios-ersd/profile",
]

[dependencies]
curios-abi = { workspace = true, features = ["archive"] }
curios-base = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
rkyv = { workspace = true }
sha2 = "0.11.0"
tracing = { workspace = true, optional = true }

[build-dependencies]
curios-abi = { workspace = true, features = ["archive"] }
curios-base = { workspace = true, features = ["archive"] }
curios-text = { workspace = true, features = ["archive"] }
curios-elab = { workspace = true, features = ["archive"] }
curios-ersd = { workspace = true, features = ["archive"] }
rkyv = { workspace = true }
sha2 = "0.11.0"
# The build script is where the fixed prelude is actually elaborated, so it is
# the only place a subscriber can observe compiler spans and events for that
# work. `curios::profile` cannot serve here: it belongs to the native product,
# which depends on this crate. The extra `fmt`/`env-filter` features stay local
# rather than joining the workspace pin, so the leaner `curios` subscriber does
# not inherit them.
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "env-filter",
], optional = true }
